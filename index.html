            ],
            tokenLogs: [
                { id: "tl_1", user: "Гүлнәр Сәрсенова", role: "Мұғалім", model: "Gemini", spent: 25, action: "Квиз құру" },

            ]
        };

        // Жергілікті интерфейс күйі (рөл, ашық бет, API кілттер)
        const uiState = {
            role: "teacher",
            tabs: {
                teacher: "ai_studio",
                student: "topics",
                admin: "users"
            },
            apiKeys: {
                geminiKey: localStorage.getItem("bolashaq_gemini_key") || "",
                openaiKey: localStorage.getItem("bolashaq_openai_key") || ""
            },
            dbConnected: false,
            dbError: ""
        };

        let dbData = loadLocalCache();
        let firestore = null;
        let stateDocRef = null;
        let isWritingToCloud = false;

        function loadLocalCache() {
            try {
                const raw = localStorage.getItem(LOCAL_CACHE_KEY);
                return raw ? { ...structuredClone(INITIAL_DATA), ...JSON.parse(raw) } : structuredClone(INITIAL_DATA);
            } catch {
                return structuredClone(INITIAL_DATA);
            }
        }

        function saveLocalCache() {
            try {
                localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(dbData));
            } catch (e) {
                console.error("Cache save error:", e);
            }
        }

        // Firestore деректерін сақтау және синхрондау
        async function persistData() {
            saveLocalCache();
            syncChrome();
            if (!stateDocRef) return;
            try {
                isWritingToCloud = true;
                await setDoc(stateDocRef, {
                    ...dbData,
                    updatedAt: Date.now()
                }, { merge: true });
                uiState.dbConnected = true;
                uiState.dbError = "";
                syncChrome();
            } catch (err) {
                console.error("Firestore write error:", err);
                uiState.dbConnected = false;
                uiState.dbError = err.message || "Жазу қатесі";
                syncChrome();
            } finally {
                setTimeout(() => { isWritingToCloud = false; }, 120);
            }
        }

        async function initFirestoreConnection() {
            try {
                const app = initializeApp(firebaseConfig);
                firestore = getFirestore(app);
                stateDocRef = doc(firestore, DB_DOC_PATH[0], DB_DOC_PATH[1]);

                const snap = await getDoc(stateDocRef);
                if (!snap.exists()) {
                    await setDoc(stateDocRef, { ...INITIAL_DATA, updatedAt: Date.now() });
                    dbData = structuredClone(INITIAL_DATA);
                    saveLocalCache();
                } else {
                    dbData = { ...structuredClone(INITIAL_DATA), ...snap.data() };
                    saveLocalCache();
                }

                uiState.dbConnected = true;
                uiState.dbError = "";
                renderAll();

                // Нақты уақыттағы тыңдаушы (realtime listener)
                onSnapshot(stateDocRef, (snapshot) => {
                    if (isWritingToCloud) return;
                    if (snapshot.exists()) {
                        dbData = { ...structuredClone(INITIAL_DATA), ...snapshot.data() };
                        saveLocalCache();
                        uiState.dbConnected = true;
                        uiState.dbError = "";
                        renderAll();
                    }
                }, (err) => {
                    console.error("Firestore snapshot error:", err);
                    uiState.dbConnected = false;
                    uiState.dbError = err.message || "Байланыс қатесі";
                    syncChrome();
                });
            } catch (err) {
                console.error("Firebase init error:", err);
                uiState.dbConnected = false;
                uiState.dbError = err.message || "Қосылу мүмкін емес";
                renderAll();
            }
        }

        window.syncWithFirestore = async function (showToastMsg = false) {
            if (!stateDocRef) {
                await initFirestoreConnection();
                return;
            }
            try {
                const snap = await getDoc(stateDocRef);
                if (snap.exists()) {
                    dbData = { ...structuredClone(INITIAL_DATA), ...snap.data() };
                    saveLocalCache();
                    uiState.dbConnected = true;
                    uiState.dbError = "";
                    renderAll();
                    if (showToastMsg) toast("Firestore деректері жаңартылды");
                }
            } catch (err) {
                uiState.dbConnected = false;
                uiState.dbError = err.message || "Жаңарту қатесі";
                syncChrome();
                if (showToastMsg) toast("Базамен байланыс жоқ (кэш қолданылуда)");
            }
        };

            renderAll();
            toast("Бастапқы деректер қалпына келтірілді");
        };

                { id: "profile", label: "Жеке кабинет" },
                { id: "settings", label: "Баптаулар" }
            ],
            student: [
                { id: "topics", label: "Тақырыптар" },

                { id: "labs", label: "Зертханалық жұмыстар" },
                { id: "ai_help", label: "ЖИ", badge: "AI" },
                { id: "profile", label: "Жеке кабинет" },
                { id: "settings", label: "Баптаулар" }
            ],
            admin: [
                { id: "users", label: "Пайдаланушылар" },
                { id: "curriculum", label: "Сыныптар & Пәндер" },
                { id: "tokens", label: "ЖИ & Токендер" },

            ]

        function currentUser() {

        }

            else if (uiState.role === "teacher") setTab("ai_studio");
            else setTab("ai_help");

        function syncChrome() {
            const u = currentUser();
            ["teacher", "student", "admin"].forEach(r => {
                const btn = document.getElementById("role-" + r);
                if (!btn) return;
                btn.className = uiState.role === r

            document.getElementById("topTokens").textContent = (u.tokens || 0).toLocaleString("ru-RU");
            document.getElementById("topUserName").textContent = u.name;
            document.getElementById("topAvatar").textContent = u.name.split(" ").map(w => w[0]).join("").slice(0, 2);

            const dbDot = document.getElementById("dbDot");
            const dbStatusText = document.getElementById("dbStatusText");

                dbDot.className = "w-2 h-2 rounded-full bg-emerald-500";

            } else {
                dbDot.className = "w-2 h-2 rounded-full bg-amber-400";
                dbStatusText.textContent = "Кэш";
            }

        // =====================================================================

                            <button onclick="setAIModel('ChatGPT')" class="px-3 py-1 rounded-lg text-xs font-bold ${dbData.ai.model === "ChatGPT" ? "bg-slate-900 text-white" : "text-slate-600"}">ChatGPT</button>

        window.setAIModel = async function (model) {
            dbData.ai.model = model;
            await persistData();
            renderView();
        };

        window.setStudioMode = async function (mode) {
            dbData.ai.studioMode = mode;
            await persistData();
            renderView();
        };

        function renderGeneratedResult(out) {
            if (out.mode === "quiz") {
                return `
                    <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">

                                <button onclick="saveGeneratedQuiz(false)" class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold">Сақтау</button>
                            </div>
                        </div>
                        <div class="space-y-3">
                            ${out.questions.map((item, idx) => `
                                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                                    <div class="text-xs sm:text-sm font-bold text-slate-900 mb-2">${idx + 1}. ${esc(item.q)}</div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs">
                                        ${item.opts.map((o, oi) => `
                                            <div class="px-3 py-1.5 rounded-lg border ${oi === item.ans ? "bg-emerald-50 border-emerald-300 text-emerald-900 font-bold" : "bg-white border-slate-200 text-slate-700"}">
                                                ${String.fromCharCode(65 + oi)}) ${esc(o)}
                                            </div>
                                        `).join("")}
                                    </div>
                                </div>
                            `).join("")}

                `;

                return `
                    <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
                        <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
                            <div>
                                <span class="text-xs font-bold text-amber-700">${out.grade}-сынып • ${esc(out.subject)} • ${out.slides.length} слайд</span>
                                <h2 class="text-base font-bold text-slate-900">${esc(out.title)}</h2>
                            </div>
                            <button onclick="saveGeneratedPresentation()" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold">
                                Презентацияға сақтау
                            </button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${out.slides.map((sl, idx) => `
                                <div class="p-4 rounded-xl bg-slate-900 text-white">
                                    <div class="text-[11px] font-bold text-amber-400 mb-1">Слайд ${idx + 1}</div>
                                    <div class="text-sm font-bold mb-2">${esc(sl.title)}</div>
                                    <ul class="text-xs text-slate-200 space-y-1 list-disc pl-4">

                    </div>
                `;
            }

            return `
                <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
                    <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">

                            <span class="text-xs font-bold text-amber-700">${out.grade}-сынып • ${esc(out.subject)}</span>
                            <h2 class="text-base font-bold text-slate-900">${esc(out.topicTitle)}</h2>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="publishMaterialAsTopic()" class="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold">+ Тақырып</button>
                            <button onclick="publishMaterialAsTask()" class="px-3 py-1.5 rounded-xl bg-amber-500 text-white text-xs font-bold">+ Практика</button>
                            <button onclick="publishMaterialAsLab()" class="px-3 py-1.5 rounded-xl border border-slate-300 text-slate-800 text-xs font-bold">+ Зертхана</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                        <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                            <div class="font-bold text-slate-900 mb-1">Тақырып</div>
                            <div class="text-slate-700 mb-2">${esc(out.summary)}</div>
                            <div class="font-mono font-bold text-amber-800">${esc(out.formula)}</div>
                        </div>
                        <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                            <div class="font-bold text-slate-900 mb-1">Практикалық жұмыс</div>
                            <div class="text-slate-700">${esc(out.practicalTask)}</div>
                        </div>
                        <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                            <div class="font-bold text-slate-900 mb-1">Виртуалды зертхана</div>
                            <div class="text-slate-700">${esc(out.labTask)}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.runTeacherGeneration = async function (e) {
            e.preventDefault();
            const u = currentUser();
            const spent = 20;
            if ((u.tokens || 0) < spent) {
                toast("Токен жеткіліксіз");
                return;
            }

            const grade = parseInt(document.getElementById("genGrade").value, 10);
            const subject = document.getElementById("genSubject").value;
            const topic = document.getElementById("genTopic").value.trim();
            const mode = dbData.ai.studioMode;
            const model = dbData.ai.model;

            dbData.scope = { grade, subject };
            const btn = document.getElementById("genSubmitBtn");
            btn.disabled = true;
            btn.textContent = "...";

            let resultObj = null;
            try {
                const rawAi = await callRealAI(model, buildStudioPrompt(mode, grade, subject, topic));
                if (rawAi) {
                    const cleaned = rawAi.replace(/```json|```/gi, "").trim();
                    const parsed = JSON.parse(cleaned);
                    resultObj = { ...parsed, mode, grade, subject };
                }
            } catch {
                // JSON парсинг немесе API кілт болмағанда құрылымды нәтиже қолданылады
            }

            if (!resultObj) {
                resultObj = buildStructuredFallback(mode, grade, subject, topic);
            }

            u.tokens = Math.max(0, (u.tokens || 0) - spent);
            dbData.ai.lastOutput = resultObj;
            dbData.tokenLogs.unshift({
                id: "tl_" + Date.now(),
                user: u.name,
                role: "Мұғалім",
                model,
                spent,
                action: `${grade}-сынып ${subject}: ${topic}`
            });

            await persistData();
            renderView();
            toast(`Дайын (-${spent} токен)`);
        };

        function buildStudioPrompt(mode, grade, subject, topic) {
            if (mode === "quiz") {
                return `Тек қана JSON қайтар: {"title":"${topic} — Квиз","timerSec":20,"questions":[{"q":"Сұрақ","opts":["А","Б","В","Г"],"ans":0}]}. ${grade}-сынып ${subject} пәні бойынша "${topic}" тақырыбына қазақша 4 сұрақ жаса.`;
            }
            if (mode === "presentation") {
                return `Тек қана JSON қайтар: {"title":"${topic}","slides":[{"title":"Слайд","points":["1","2"],"note":"Ескертпе"}]}. ${grade}-сынып ${subject} пәні бойынша "${topic}" тақырыбына қазақша 3 қысқа слайд жаса.`;
            }
            return `Тек қана JSON қайтар: {"topicTitle":"${topic}","summary":"Қысқа түсіндірме","formula":"Формула немесе ереже","practicalTask":"Практикалық тапсырма","labTask":"Зертханалық жұмыс"}. ${grade}-сынып ${subject} пәні бойынша қазақша жаз.`;
        }

        function buildStructuredFallback(mode, grade, subject, topic) {
            if (mode === "quiz") {
                return {
                    mode: "quiz",
                    grade,
                    subject,
                    title: `${topic} — Квиз`,
                    timerSec: 20,
                    questions: [
                        {
                            q: `${grade}-сынып ${subject}: «${topic}» ұғымының негізгі мәні неде?`,
                            opts: ["Негізгі заңдылықты анықтау", "Кесте толтыру", "Мәтін көшіру", "Өлшем бірліксіз есептеу"],
                            ans: 0
                        },
                        {
                            q: `«${topic}» есебін шығарғанда алдымен нені тексеру керек?`,
                            opts: ["Берілген шамалар мен ХБЖ бірліктерін", "Жауаптың ұзындығын", "Нұсқа ретін", "Кездейсоқ санды"],
                            ans: 0
                        },
                        {
                            q: `«${topic}» бойынша практикалық нәтиже қайда қолданылады?`,
                            opts: ["Талдау және есептеуде", "Тек жаттауда", "Қолданылмайды", "Басқа бөлімде"],
                            ans: 0
                        }
                    ]
                };
            }
            if (mode === "presentation") {
                return {
                    mode: "presentation",
                    grade,
                    subject,
                    title: `${topic} (${grade}-сынып)`,
                    slides: [
                        { title: `${topic} — Кіріспе`, points: [`${subject}, ${grade}-сынып`, "Негізгі ұғымдар мен белгілеулер"], note: "Терминдерді нақтылаңыз." },
                        { title: "Негізгі заңдылық", points: ["Шамалар арасындағы тәуелділік", "Формула және өлшем бірліктері"], note: "Мысал келтіріңіз." },
                        { title: "Бекіту", points: ["Интерактивті квиз сұрақтары", "Практикалық тапсырма"], note: "Сыныппен қорытындылаңыз." }
                    ]
                };
            }
            return {
                mode: "material",
                grade,
                subject,
                topicTitle: topic,
                summary: `${grade}-сынып ${subject} пәні бойынша «${topic}» тақырыбының негізгі мазмұны.`,
                formula: "Негізгі формула / Ереже",
                practicalTask: `«${topic}» тақырыбына практикалық тапсырманы орындаңыз.`,
                labTask: `«${topic}» бойынша виртуалды тәжірибе жүргізіп, нәтижесін жазыңыз.`
            };
        }

        window.saveGeneratedQuiz = async function (launchNow) {
            const out = dbData.ai.lastOutput;
            if (!out || out.mode !== "quiz") return;
            const newQuiz = {
                id: "qz_" + Date.now(),
                grade: out.grade,
                subject: out.subject,
                title: out.title,
                timerSec: out.timerSec || 20,
                assigned: true,
                questions: out.questions
            };
            dbData.quizzes.unshift(newQuiz);
            await persistData();
            toast("Квиз сақталды");
            setTab("interactive");
            if (launchNow) setTimeout(() => startQuizRunner(newQuiz.id), 60);
        };

        window.saveGeneratedPresentation = async function () {
            const out = dbData.ai.lastOutput;
            if (!out || out.mode !== "presentation") return;
            const pres = {
                id: "pr_" + Date.now(),

                subject: out.subject,
                title: out.title,
                slides: out.slides

            setTab("presentations");

                id: "tk_" + Date.now(),
                grade: out.grade,
                subject: out.subject,
                type: "Практикалық",

            const out = dbData.ai.lastOutput;

                id: "lb_" + Date.now(),

                assigned: true

            await persistData();

        };

        // =====================================================================
        // МҰҒАЛІМ: ПРЕЗЕНТАЦИЯ ЖӘНЕ ИНТЕРАКТИВТІ КВИЗ ОЙНАТҚЫШЫ
        // =====================================================================
        function viewTeacherPresentations() {
            return `
                <div class="flex items-center justify-between gap-3 mb-5">
                    <h1 class="text-xl font-bold text-slate-900">Презентация</h1>
                    <button onclick="setStudioMode('presentation'); setTab('ai_studio');" class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold">+ ЖИ Презентация</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${dbData.presentations.map(p => `
                        <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col justify-between">
                            <div>
                                <span class="text-xs font-bold text-amber-700">${p.grade}-сынып • ${esc(p.subject)}</span>
                                <h3 class="text-base font-bold text-slate-900 mt-1">${esc(p.title)}</h3>

        window.openSlideDeck = function (id, idx) {

        window.toggleQuizAssign = async function (id) {
            const q = dbData.quizzes.find(x => x.id === id);

            q.assigned = !q.assigned;
            await persistData();
            renderView();

        };

        window.startQuizRunner = function (quizId) {
            const q = dbData.quizzes.find(x => x.id === quizId);
            if (!q || !q.questions.length) return;
            quizSession = {
                quiz: q,
                index: 0,
                score: 0,
                answered: false,
                selected: null
            };
            renderQuizStage();
        };

        function renderQuizStage() {
            const stage = document.getElementById("liveQuizStage");
            if (!stage || !quizSession) return;
            const { quiz, index, score, answered, selected } = quizSession;
            const item = quiz.questions[index];

            stage.innerHTML = `
                <div class="bg-slate-900 text-white rounded-2xl p-5 space-y-4">
                    <div class="flex items-center justify-between text-xs">
                        <span class="font-bold text-amber-400">${esc(quiz.title)} • ${index + 1}/${quiz.questions.length}</span>
                        <span class="px-2.5 py-1 rounded-lg bg-slate-800 font-bold tabular-nums">Ұпай: ${score}</span>
                    </div>

                    <div class="text-base sm:text-lg font-bold">${esc(item.q)}</div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        ${item.opts.map((opt, oi) => {
                            let cls = "bg-slate-800 hover:bg-slate-700 border-slate-700 text-white";
                            if (answered) {
                                if (oi === item.ans) cls = "bg-emerald-600 border-emerald-500 text-white font-bold";
                                else if (oi === selected) cls = "bg-rose-600 border-rose-500 text-white";
                                else cls = "bg-slate-800/60 border-slate-800 text-slate-400";
                            }
                            return `
                                <button onclick="answerQuizOption(${oi})" ${answered ? "disabled" : ""} class="p-3.5 rounded-xl border text-left text-xs sm:text-sm font-semibold transition-colors ${cls}">
                                    ${String.fromCharCode(65 + oi)}. ${esc(opt)}
                                </button>
                            `;
                        }).join("")}
                    </div>

                    ${answered ? `
                        <div class="flex justify-end pt-1">
                            <button onclick="nextQuizQuestion()" class="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold">
                                ${index + 1 < quiz.questions.length ? "Келесі →" : "Аяқтау"}
                            </button>
                        </div>
                    ` : ""}
                </div>
            `;
        }

        window.answerQuizOption = function (oi) {
            if (!quizSession || quizSession.answered) return;
            const item = quizSession.quiz.questions[quizSession.index];
            quizSession.answered = true;
            quizSession.selected = oi;
            if (oi === item.ans) quizSession.score += 100;
            renderQuizStage();
        };

        window.nextQuizQuestion = async function () {
            if (!quizSession) return;
            if (quizSession.index + 1 < quizSession.quiz.questions.length) {
                quizSession.index += 1;
                quizSession.answered = false;
                quizSession.selected = null;
                renderQuizStage();
            } else {
                const finalScore = quizSession.score;
                const title = quizSession.quiz.title;
                const u = currentUser();
                if (uiState.role === "student") {
                    u.points = (u.points || 0) + finalScore;
                }
                dbData.submissions.unshift({
                    id: "sub_" + Date.now(),
                    studentName: u.name,
                    kind: "Квиз",
                    title,
                    detail: `${finalScore} ұпай`,
                    score: Math.round(finalScore / 30)
                });
                quizSession = null;
                await persistData();
                renderView();
                toast(`Нәтиже: ${finalScore} ұпай`);
            }
        };

                <form onsubmit="addTaskItem(event)" class="space-y-3">

        function viewStudentTasks() {

        window.submitStudentTask = async function (e, id) {
            e.preventDefault();

            const val = document.getElementById("ans_" + id).value.trim();

            t.status = "submitted";

            dbData.submissions.unshift({
                id: "sub_" + Date.now(),
                studentName: currentUser().name,
                kind: "Практика",
                title: t.title,
                detail: val,
                score: 10
            });

            renderView();
            toast("Жауап жіберілді");

        // ОҚУШЫ: ЗЕРТХАНАЛЫҚ ЖҰМЫСТАР
        const labSim = {
            mode: "physics",
            u: 12,
            r: 6,
            acid: 10,
            base: 10
        };

        function viewStudentLabs() {
            const currentA = (labSim.u / labSim.r).toFixed(2);
            const ph = Math.max(1, Math.min(14, (7 + (labSim.base - labSim.acid) * 0.5))).toFixed(1);

            return `
                <div class="flex flex-wrap items-center justify-between gap-3 mb-5">

                        <button onclick="labSim.mode='physics'; renderView();" class="px-3 py-1 rounded-lg text-xs font-bold ${labSim.mode === "physics" ? "bg-slate-900 text-white" : "text-slate-600"}">Физика: Ом заңы</button>
                        <button onclick="labSim.mode='chemistry'; renderView();" class="px-3 py-1 rounded-lg text-xs font-bold ${labSim.mode === "chemistry" ? "bg-slate-900 text-white" : "text-slate-600"}">Химия: pH</button>
                    </div>
                </div>

                ${labSim.mode === "physics" ? `
                    <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-5">

                                <div id="simItxt" class="text-3xl font-extrabold text-amber-400 tabular-nums mt-1">${currentA} А</div>
                            </div>
                        </div>
                        <button onclick="sendLabResult('Зертхана (Физика)', 'Ом заңы', 'U=' + labSim.u + 'В, R=' + labSim.r + 'Ом → I=' + (labSim.u/labSim.r).toFixed(2) + 'А')" class="px-4 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold">
                            Нәтижені жіберу
                        </button>
                    </div>
                ` : `
                    <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-5">

                                <input type="range" min="0" max="20" value="${labSim.base}" oninput="labSim.base=+this.value; renderView();" class="w-full accent-blue-600">

        window.askStudentAI = async function (e) {

            u.tokens = Math.max(0, (u.tokens || 0) - spent);
            dbData.studentChat.push({ role: "ai", model: dbData.ai.model, text: reply });
            dbData.tokenLogs.unshift({
                id: "tl_" + Date.now(),

                role: "Оқушы",

            });

        };

        // =====================================================================
        // GEMINI / CHATGPT API ШАҚЫРУ ЖӘНЕ МОДАЛЬДЫ ТЕРЕЗЕЛЕР
        // =====================================================================
        async function callRealAI(model, prompt) {
            try {
                if (model === "Gemini" && uiState.apiKeys.geminiKey) {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(uiState.apiKeys.geminiKey)}`;
                    const res = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await res.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
                }
                if (model === "ChatGPT" && uiState.apiKeys.openaiKey) {
                    const res = await fetch("https://api.openai.com/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${uiState.apiKeys.openaiKey}`
                        },
                        body: JSON.stringify({
                            model: "gpt-4o-mini",
                            messages: [{ role: "user", content: prompt }]
                        })
                    });
                    const data = await res.json();
                    return data.choices?.[0]?.message?.content || null;
                }
            } catch {
                return null;
            }
            return null;
        }
