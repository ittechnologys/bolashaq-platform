        }

            transform: translateY(-1px) scale(1.015);
            filter: drop-shadow(0 4px 10px rgba(234, 88, 12, 0.32));
        }

            transform: scale(1.05);
        }

        @keyframes bolashaqEnter {
            0% {
                opacity: 0;
                transform: translateY(8px) scale(0.992);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.25); }
            50% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
        }

        @keyframes spinFast {
            to { transform: rotate(360deg); }
        }

        .anim-enter {
            animation: bolashaqEnter 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .anim-glow {
            animation: pulseGlow 2.4s infinite;
        }

        .btn-press {
            transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-press:active:not(:disabled) {
            transform: scale(0.965);
        }

        .btn-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 9999px;
            display: inline-block;

        }

            },
            dbConnected: false,

        };

        let dbData = loadLocalCache();
        let firestore = null;
        let auth = null;
        let stateDocRef = null;
        let isWritingToCloud = false;

        function loadLocalCache() {
            try {
                const raw = localStorage.getItem(LOCAL_CACHE_KEY);
                return raw ? { ...structuredClone(INITIAL_DATA), ...JSON.parse(raw) } : structuredClone(INITIAL_DATA);
            } catch {
                return structuredClone(INITIAL_DATA);
            }
        }

        function saveLocalCache() {
            try {
                localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(dbData));
            } catch (e) {
                console.error("Cache error:", e);
            }
        }

        async function persistData() {
            saveLocalCache();
            syncChrome();
            if (!stateDocRef) return;
            try {
                isWritingToCloud = true;
                await setDoc(stateDocRef, { ...dbData, updatedAt: Date.now() }, { merge: true });
                uiState.dbConnected = true;
                uiState.dbError = "";
                syncChrome();
            } catch (err) {
                uiState.dbConnected = false;
                uiState.dbError = err.message || "Жазу қатесі";
                syncChrome();
            } finally {
                setTimeout(() => { isWritingToCloud = false; }, 120);
            }
        }

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                firestore = getFirestore(app);
                auth = getAuth(app);
                stateDocRef = doc(firestore, DB_DOC_PATH[0], DB_DOC_PATH[1]);

                onAuthStateChanged(auth, async (user) => {
                    uiState.authUser = user;
                    if (user) {
                        localStorage.setItem(ONBOARDED_KEY, "1");
                        let existing = dbData.users.find(
                            u => u.id === user.uid || (user.email && u.email === user.email)
                        );
                        if (!existing) {
                            const reg = uiState.pendingRegistration;
                            existing = {
                                id: user.uid,
                                name: user.displayName || reg.name || (user.email ? user.email.split("@")[0] : "Пайдаланушы"),
                                email: user.email || "",
                                role: reg.role || uiState.role,
                                grade: (reg.role || uiState.role) === "student" ? (reg.grade || 9) : null,
                                subject: reg.subject || dbData.scope.subject,
                                tokens: 2000,
                                points: 0
                            };
                            dbData.users.unshift(existing);
                            uiState.role = existing.role;
                            await persistData();
                        } else {
                            uiState.role = existing.role || uiState.role;
                            syncChrome();
                        }
                        renderAll();
                    } else {
                        syncChrome();
                        if (!localStorage.getItem(ONBOARDED_KEY)) {
                            openAuthModal("register");
                        }
                    }
                });

                const snap = await getDoc(stateDocRef);
                if (!snap.exists()) {
                    await setDoc(stateDocRef, { ...INITIAL_DATA, updatedAt: Date.now() });
                    dbData = structuredClone(INITIAL_DATA);
                    saveLocalCache();
                } else {
                    dbData = { ...structuredClone(INITIAL_DATA), ...snap.data() };
                    saveLocalCache();
                }

                uiState.dbConnected = true;
                uiState.dbError = "";
                renderAll();

                onSnapshot(stateDocRef, (snapshot) => {
                    if (isWritingToCloud) return;
                    if (snapshot.exists()) {
                        dbData = { ...structuredClone(INITIAL_DATA), ...snapshot.data() };
                        saveLocalCache();
                        uiState.dbConnected = true;
                        uiState.dbError = "";
                        renderAll();
                    }
                }, (err) => {
                    uiState.dbConnected = false;
                    uiState.dbError = err.message || "Байланыс қатесі";
                    syncChrome();
                });
            } catch (err) {
                uiState.dbConnected = false;
                uiState.dbError = err.message || "Қосылу мүмкін емес";
                renderAll();
            }
        }

        window.openAuthModal = function (mode = "register") {

                    ${isReg ? `

                    <div class="relative py-1">

                    </div>

                    <button type="button" id="googleSignInBtn" onclick="handleGoogleSignIn(this)" class="w-full py-2.5 px-4 rounded-xl border border-slate-300 hover:bg-slate-50 text-slate-800 text-xs sm:text-sm font-bold flex items-center justify-center gap-2 btn-press">

        };

        window.toggleRegGradeField = function () {
            const roleEl = document.getElementById("regRole");
            const wrapEl = document.getElementById("regGradeWrap");
            if (!roleEl || !wrapEl) return;
            wrapEl.classList.toggle("hidden", roleEl.value !== "student");
        };

        window.handleRegisterSubmit = async function (e) {
            e.preventDefault();
            const btn = document.getElementById("regSubmitBtn");
            setButtonLoading(btn, true, "Тіркелуде...");

            const name = document.getElementById("regName").value.trim();
            const role = document.getElementById("regRole").value;
            const gradeEl = document.getElementById("regGrade");
            const grade = role === "student" && gradeEl ? parseInt(gradeEl.value, 10) : null;
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value;

            uiState.pendingRegistration = { name, role, grade, subject: dbData.scope.subject };
            uiState.role = role;
            localStorage.setItem(ONBOARDED_KEY, "1");

            try {
                if (auth) {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(cred.user, { displayName: name });
                    const newProfile = {
                        id: cred.user.uid,
                        name,
                        email,
                        role,
                        grade,
                        subject: dbData.scope.subject,
                        tokens: 2000,
                        points: 0
                    };
                    dbData.users = [newProfile, ...dbData.users.filter(u => u.id !== cred.user.uid && u.email !== email)];
                    await persistData();
                    closeModal();
                    renderAll();
                    toast("Тіркелу сәтті аяқталды");
                    return;
                }
            } catch (err) {
                const msg = err.code === "auth/email-already-in-use"
                    ? "Бұл email тіркелген. «Кіру» қойындысынан кіріңіз."
                    : (err.message || "Тіркелу қатесі");
                toast(msg);
                setButtonLoading(btn, false);
                return;
            }

            const localUser = {
                id: "u_" + Date.now(),
                name,
                email,
                role,
                grade,
                subject: dbData.scope.subject,
                tokens: 2000,
                points: 0
            };
            dbData.users.unshift(localUser);
            await persistData();
            closeModal();
            renderAll();
            toast("Тіркелу сақталды");
        };

        window.handleEmailLoginSubmit = async function (e) {
            e.preventDefault();
            const btn = document.getElementById("loginSubmitBtn");
            setButtonLoading(btn, true, "Кіруде...");

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            localStorage.setItem(ONBOARDED_KEY, "1");

            try {
                if (auth) {
                    await signInWithEmailAndPassword(auth, email, password);
                    closeModal();
                    toast("Жүйеге кірдіңіз");
                    return;
                }
            } catch (err) {
                toast(err.code === "auth/invalid-credential" ? "Email немесе құпиясөз қате" : (err.message || "Кіру қатесі"));
                setButtonLoading(btn, false);
                return;
            }

            const found = dbData.users.find(u => u.email === email);
            if (found) uiState.role = found.role;
            closeModal();
            renderAll();
            toast("Кірдіңіз");
        };

        window.handleGoogleSignIn = async function (btnEl = null) {
            setButtonLoading(btnEl, true, "Google...");
            localStorage.setItem(ONBOARDED_KEY, "1");
            try {
                if (auth) {
                    const provider = new GoogleAuthProvider();
                    const res = await signInWithPopup(auth, provider);
                    const user = res.user;
                    const reg = uiState.pendingRegistration;
                    const existing = dbData.users.find(u => u.id === user.uid || (user.email && u.email === user.email));
                    if (!existing) {
                        dbData.users.unshift({
                            id: user.uid,
                            name: user.displayName || reg.name || "Google қолданушы",
                            email: user.email || "",
                            role: reg.role || uiState.role,
                            grade: (reg.role || uiState.role) === "student" ? (reg.grade || 9) : null,
                            subject: dbData.scope.subject,
                            tokens: 2000,
                            points: 0
                        });
                        await persistData();
                    } else {
                        uiState.role = existing.role || uiState.role;
                    }
                    closeModal();
                    renderAll();
                    toast("Google арқылы кірдіңіз");
                    return;
                }
            } catch (err) {
                toast(err.message || "Google кіру қатесі");
            } finally {
                setButtonLoading(btnEl, false);
            }
        };

        window.handleSignOut = async function () {
            try {
                if (auth && uiState.authUser) {
                    await signOut(auth);
                }
            } catch {
                // ignore
            }
            uiState.authUser = null;
            syncChrome();
            toast("Шықтыңыз");

        function currentUser() {
            if (uiState.authUser) {
                const matched = dbData.users.find(
                    u => u.id === uiState.authUser.uid || (uiState.authUser.email && u.email === uiState.authUser.email)
                );
                if (matched) return matched;
            }
            const idMap = { teacher: "u_t1", student: "u_s1", admin: "u_a1" };
            return dbData.users.find(u => u.id === idMap[uiState.role]) || dbData.users[0];

        function syncChrome() {
            const u = currentUser();
            ["teacher", "student", "admin"].forEach(r => {
                const btn = document.getElementById("role-" + r);
                if (!btn) return;
                btn.className = uiState.role === r
                    ? "px-2.5 sm:px-3.5 py-1 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-2xs btn-press"

        function renderNav() {
            const nav = document.getElementById("sidebarNav");

            const btn = document.getElementById("teacherChatBtn");
            const msg = inp.value.trim();
            if (!msg) return;

            const u = currentUser();
            if ((u.tokens || 0) <= 0) {

            inp.value = "";
            dbData.aiChat.push({ role: "user", text: msg });

            setButtonLoading(document.getElementById("teacherChatBtn"), true, "...");

            const prompt = `${dbData.scope.grade}-сынып ${dbData.scope.subject} пәні мұғаліміне арналған нақты, құрылымды жауап бер (артық кіріспе сөзсіз): ${msg}`;
            const aiResult = await callRealAIWithTokens(dbData.ai.model, prompt, msg);

            const spent = Math.min(u.tokens, aiResult.tokensUsed);
            u.tokens = Math.max(0, (u.tokens || 0) - spent);
            dbData.aiChat.push({
                role: "ai",
                model: dbData.ai.model,
                tokensUsed: spent,
                text: aiResult.text
            });
            dbData.tokenLogs.unshift({
                id: "tl_" + Date.now(),
                user: u.name,
                role: "Мұғалім",
                model: dbData.ai.model,
                spent,
                action: msg.slice(0, 32)
            });

            await persistData();
            renderView();
            toast(`Жауап дайын (-${spent} токен)`);
        };

        window.runTeacherGeneration = async function (e) {
            e.preventDefault();
            const u = currentUser();
            if ((u.tokens || 0) <= 0) {
                toast("Токен жеткіліксіз");
                return;
            }

            const grade = parseInt(document.getElementById("genGrade").value, 10);
            const subject = document.getElementById("genSubject").value;
            const topic = document.getElementById("genTopic").value.trim();
            const mode = dbData.ai.studioMode;
            const model = dbData.ai.model;

            dbData.scope = { grade, subject };
            const btn = document.getElementById("genSubmitBtn");
            setButtonLoading(btn, true, "...");

            let resultObj = null;
            let tokensSpent = 20;

            try {
                const rawRes = await callRealAIWithTokens(model, buildStudioPrompt(mode, grade, subject, topic), topic);
                tokensSpent = Math.min(u.tokens, rawRes.tokensUsed);
                if (rawRes.usedRealApi && rawRes.text) {
                    const cleaned = rawRes.text.replace(/```json|```/gi, "").trim();
                    const parsed = JSON.parse(cleaned);
                    resultObj = { ...parsed, mode, grade, subject };
                }
            } catch {
                // fallback
            }

            if (!resultObj) {
                resultObj = buildStructuredFallback(mode, grade, subject, topic);
            }

            u.tokens = Math.max(0, (u.tokens || 0) - tokensSpent);
            dbData.ai.lastOutput = resultObj;
            dbData.tokenLogs.unshift({
                id: "tl_" + Date.now(),
                user: u.name,
                role: "Мұғалім",
                model,
                spent: tokensSpent,
                action: `${grade}-сынып ${subject}: ${topic}`
            });

            await persistData();
            renderView();
            toast(`Дайын (-${tokensSpent} токен)`);
        };

        function buildStudioPrompt(mode, grade, subject, topic) {
            if (mode === "quiz") {
                return `Тек қана JSON қайтар: {"title":"${topic} — Квиз","timerSec":20,"questions":[{"q":"Сұрақ","opts":["А","Б","В","Г"],"ans":0}]}. ${grade}-сынып ${subject} пәні бойынша "${topic}" тақырыбына қазақша 4 нақты сұрақ жаса.`;
            }
            if (mode === "presentation") {
                return `Тек қана JSON қайтар: {"title":"${topic}","slides":[{"title":"Слайд","points":["1","2"],"note":"Ескертпе"}]}. ${grade}-сынып ${subject} пәні бойынша "${topic}" тақырыбына қазақша 3 жүйелі слайд жаса.`;
            }
            return `Тек қана JSON қайтар: {"topicTitle":"${topic}","summary":"Қысқа нақты түсіндірме","formula":"Формула немесе ереже","practicalTask":"Практикалық тапсырма","labTask":"Зертханалық жұмыс"}. ${grade}-сынып ${subject} пәні бойынша қазақша жаз.`;
        }

        function buildStructuredFallback(mode, grade, subject, topic) {
            if (mode === "quiz") {
                return {
                    mode: "quiz",
                    grade,
                    subject,
                    title: `${topic} — Квиз`,
                    timerSec: 20,
                    questions: [
                        {
                            q: `${grade}-сынып ${subject}: «${topic}» ұғымының негізгі мағынасы қандай?`,
                            opts: ["Негізгі заңдылықты талдау", "Кесте толтыру", "Мәтін көшіру", "Өлшемсіз сан жазу"],
                            ans: 0
                        },
                        {
                            q: `«${topic}» бойынша есеп шығарғанда алдымен нені ескеру керек?`,
                            opts: ["Бастапқы шамалар мен бірліктерді", "Нұсқа санын", "Мәтін ұзындығын", "Кездейсоқ мәнді"],
                            ans: 0
                        },
                        {
                            q: `«${topic}» нәтижесін практикада қалай дәлелдеуге болады?`,
                            opts: ["Тәжірибе мен есептеу арқылы", "Болжаммен ғана", "Қолданбай", "Басқа пәнмен"],
                            ans: 0
                        }
                    ]
                };
            }
            if (mode === "presentation") {
                return {
                    mode: "presentation",
                    grade,
                    subject,
                    title: `${topic} (${grade}-сынып)`,
                    slides: [
                        { title: `${topic} — Негізгі ұғым`, points: [`${subject}, ${grade}-сынып`, "Негізгі терминдер мен белгілеулер"], note: "Негізгі анықтаманы бекітіңіз." },
                        { title: "Заңдылық пен формула", points: ["Шамалар байланысы", "Есептеу тәртібі"], note: "Мысал келтіріңіз." },
                        { title: "Қорытынды және бақылау", points: ["Интерактивті сұрақтар", "Практикалық бекіту"], note: "Қорытынды жасаңыз." }
                    ]
                };
            }
            return {
                mode: "material",
                grade,
                subject,
                topicTitle: topic,
                summary: `${grade}-сынып ${subject} пәні бойынша «${topic}» тақырыбының нақты түсіндірмесі.`,
                formula: "Негізгі формула / Ереже",
                practicalTask: `«${topic}» бойынша 2 есеп шығарып, қорытынды жазыңыз.`,
                labTask: `«${topic}» параметрлерін өзгертіп, бақылау нәтижесін тіркеңіз.`
            };
        }

        window.startQuizRunner = function (quizId) {
            const q = dbData.quizzes.find(x => x.id === quizId);
            if (!q || !q.questions.length) return;
            quizSession = { quiz: q, index: 0, score: 0, answered: false, selected: null };
            renderQuizStage();
        };

        function renderQuizStage() {
            const stage = document.getElementById("liveQuizStage");
            if (!stage || !quizSession) return;
            const { quiz, index, score, answered, selected } = quizSession;
            const item = quiz.questions[index];

            stage.innerHTML = `
                <div class="bg-slate-900 text-white rounded-2xl p-5 space-y-4 anim-enter">
                    <div class="flex items-center justify-between text-xs">
                        <span class="font-bold text-amber-400">${esc(quiz.title)} • ${index + 1}/${quiz.questions.length}</span>
                        <span class="px-2.5 py-1 rounded-lg bg-slate-800 font-bold tabular-nums">Ұпай: ${score}</span>
                    </div>

                    <div class="text-base sm:text-lg font-bold">${esc(item.q)}</div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        ${item.opts.map((opt, oi) => {
                            let cls = "bg-slate-800 hover:bg-slate-700 border-slate-700 text-white";
                            if (answered) {
                                if (oi === item.ans) cls = "bg-emerald-600 border-emerald-500 text-white font-bold";
                                else if (oi === selected) cls = "bg-rose-600 border-rose-500 text-white";
                                else cls = "bg-slate-800/60 border-slate-800 text-slate-400";
                            }
                            return `
                                <button onclick="answerQuizOption(${oi})" ${answered ? "disabled" : ""} class="p-3.5 rounded-xl border text-left text-xs sm:text-sm font-semibold btn-press ${cls}">
                                    ${String.fromCharCode(65 + oi)}. ${esc(opt)}
                                </button>
                            `;
                        }).join("")}
                    </div>

                    ${answered ? `
                        <div class="flex justify-end pt-1">
                            <button onclick="nextQuizQuestion()" class="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold btn-press">
                                ${index + 1 < quiz.questions.length ? "Келесі →" : "Аяқтау"}
                            </button>
                        </div>
                    ` : ""}
                </div>
            `;
        }

        window.answerQuizOption = function (oi) {
            if (!quizSession || quizSession.answered) return;
            const item = quizSession.quiz.questions[quizSession.index];
            quizSession.answered = true;
            quizSession.selected = oi;
            if (oi === item.ans) quizSession.score += 100;
            renderQuizStage();
        };

        window.nextQuizQuestion = async function () {
            if (!quizSession) return;
            if (quizSession.index + 1 < quizSession.quiz.questions.length) {
                quizSession.index += 1;
                quizSession.answered = false;
                quizSession.selected = null;
                renderQuizStage();
            } else {
                const finalScore = quizSession.score;
                const title = quizSession.quiz.title;
                const u = currentUser();
                if (uiState.role === "student") u.points = (u.points || 0) + finalScore;
                dbData.submissions.unshift({
                    id: "sub_" + Date.now(),
                    studentName: u.name,
                    kind: "Квиз",
                    title,
                    detail: `${finalScore} ұпай`,
                    score: Math.round(finalScore / 30)
                });
                quizSession = null;
                await persistData();
                renderView();
                toast(`Нәтиже: ${finalScore} ұпай`);
            }
        };

        window.askStudentAI = async function (e) {
            e.preventDefault();
            const u = currentUser();
            if ((u.tokens || 0) <= 0) {
                toast("Токен таусылды");
                return;
            }
            const inp = document.getElementById("studentQInput");
            const q = inp.value.trim();
            if (!q) return;

            inp.value = "";
            dbData.aiChat.push({ role: "user", text: q });
            renderView();
            setButtonLoading(document.getElementById("studentAskBtn"), true, "...");

            const aiResult = await callRealAIWithTokens(
                dbData.ai.model,
                `Оқушыға түсінікті, нақты қазақша жауап бер: ${q}`,
                q
            );

            const spent = Math.min(u.tokens, aiResult.tokensUsed);
            u.tokens = Math.max(0, (u.tokens || 0) - spent);
            dbData.aiChat.push({
                role: "ai",
                model: dbData.ai.model,
                tokensUsed: spent,
                text: aiResult.text
            });
            dbData.tokenLogs.unshift({
                id: "tl_" + Date.now(),
                user: u.name,
                role: "Оқушы",
                model: dbData.ai.model,
                spent,
                action: q.slice(0, 30)
            });

            await persistData();
            renderView();
            toast(`Жауап дайын (-${spent} токен)`);
        };
