<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOLASHAQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #0B111E;
            --bg-surface: #111827;
            --bg-card: rgba(17, 24, 39, 0.88);
            --border-subtle: rgba(255, 255, 255, 0.09);
            --emerald-accent: #10B981;
            --gold-accent: #F59E0B;
        }

        html, body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 12% 8%, rgba(16, 185, 129, 0.12), transparent 38%),
                radial-gradient(circle at 88% 12%, rgba(245, 158, 11, 0.11), transparent 40%),
                linear-gradient(160deg, #070B14 0%, #0B111E 50%, #0F172A 100%);
            color: #F8FAFC;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.84);
            backdrop-filter: blur(18px) saturate(145%);
            -webkit-backdrop-filter: blur(18px) saturate(145%);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.36);
        }

        .glass-elevated {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.11);
        }

        .brand-wordmark {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            font-weight: 800;
            letter-spacing: 0.09em;
            background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 55%, #FCD34D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* iPhone экран блоктан шыққандағыдай серпімді қону анимациясы */
        @keyframes iphoneUnlockSettle {
            0% {
                opacity: 0;
                transform: scale(1.12) translateY(18px);
                filter: blur(6px);
            }
            65% {
                opacity: 1;
                transform: scale(0.99) translateY(-2px);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        @keyframes iphoneTileSpring {
            0% {
                opacity: 0;
                transform: scale(0.86) translateY(18px);
            }
            70% {
                opacity: 1;
                transform: scale(1.015) translateY(-2px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(16px) scale(0.96); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .anim-unlock {
            animation: iphoneUnlockSettle 0.52s cubic-bezier(0.2, 0.92, 0.25, 1.04) both;
        }

        .anim-tile {
            animation: iphoneTileSpring 0.42s cubic-bezier(0.22, 1.15, 0.36, 1) both;
        }

        .anim-toast {
            animation: toastIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .tap-btn {
            transition: transform 0.1s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
        }

        .tap-btn:active:not(:disabled) {
            transform: scale(0.965);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 9999px;
            display: inline-block;
            animation: spin 0.6s linear infinite;
            vertical-align: -2px;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B111E; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    </style>
</head>
<body class="flex flex-col antialiased selection:bg-emerald-500/30 selection:text-emerald-200">

    <!-- =================================================================== -->
    <!-- 1. БАСТАПҚЫ КІРУ / ТІРКЕЛУ ЭКРАНЫ (НАҚТЫ FIREBASE AUTH)             -->
    <!-- =================================================================== -->
    <div id="authGate" class="fixed inset-0 z-50 overflow-y-auto bg-[#070B14]/90 backdrop-blur-xl flex items-center justify-center p-4">
        <div class="w-full max-w-3xl rounded-3xl glass-elevated shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-12">

            <!-- Сол жақ бренд және статус бөлімі -->
            <div class="md:col-span-5 bg-gradient-to-br from-[#0B111E] via-[#111827] to-[#064E3B]/50 p-6 sm:p-7 flex flex-col justify-between border-b md:border-b-0 md:border-r border-white/10">
                <div class="space-y-5">
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-emerald-500/20 to-amber-500/20 border border-emerald-400/30 flex items-center justify-center shadow-lg">
                            <svg class="w-6 h-6" viewBox="0 0 32 32" fill="none">
                                <defs>
                                    <linearGradient id="bolashaqEmblemGrad1" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                                        <stop offset="0%" stop-color="#10B981"/>
                                        <stop offset="100%" stop-color="#F59E0B"/>
                                    </linearGradient>
                                </defs>
                                <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" stroke="url(#bolashaqEmblemGrad1)" stroke-width="2.2" fill="rgba(16,185,129,0.08)"/>
                                <path d="M11 10.5H17.5C19.433 10.5 21 12.067 21 14C21 15.1 20.48 16.08 19.68 16.72C20.78 17.34 21.5 18.5 21.5 19.85C21.5 21.86 19.86 23.5 17.85 23.5H11V10.5Z" stroke="#F8FAFC" stroke-width="2" stroke-linejoin="round"/>
                                <path d="M11 16.8H18.2" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div>
                            <div class="brand-wordmark text-xl leading-none">BOLASHAQ</div>
                            <div class="text-[11px] font-semibold text-emerald-400/90 mt-1">1–11 СЫНЫП • QUIZ & AI</div>
                        </div>
                    </div>

                    <div class="space-y-2 pt-2 text-xs text-slate-300">
                        <div class="px-3.5 py-2.5 rounded-xl bg-white/[0.04] border border-white/[0.07] flex items-center justify-between">
                            <span>Рөлдік оқшаулау</span>
                            <span class="text-emerald-400 font-bold">Firestore</span>
                        </div>
                        <div class="px-3.5 py-2.5 rounded-xl bg-white/[0.04] border border-white/[0.07] flex items-center justify-between">
                            <span>ЖИ ядросы</span>
                            <span class="text-amber-400 font-bold">Gemini • GPT</span>
                        </div>
                        <div class="px-3.5 py-2.5 rounded-xl bg-white/[0.04] border border-white/[0.07] flex items-center justify-between">
                            <span>Медиа & Экран</span>
                            <span class="text-slate-200 font-bold">Фото • Видео</span>
                        </div>
                    </div>
                </div>

                <div class="pt-6 mt-6 border-t border-white/10 flex items-center justify-between text-[11px] text-slate-400">
                    <span id="gateFirebaseState" class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <span>bolashaq-e214e</span>
                    </span>
                    <div id="gateNetIndicator" class="flex items-center gap-1.5 text-slate-200 font-semibold"></div>
                </div>
            </div>

            <!-- Оң жақ формалар бөлімі -->
            <div class="md:col-span-7 p-6 sm:p-7 flex flex-col justify-between bg-[#0F172A]/95">
                <div>
                    <div class="grid grid-cols-2 bg-slate-950/90 p-1 rounded-2xl border border-white/10 mb-5">
                        <button type="button" data-action="auth-tab" data-mode="login" id="authTabLogin" class="py-2 rounded-xl text-xs sm:text-sm font-bold tap-btn bg-emerald-500 text-slate-950">
                            Кіру
                        </button>
                        <button type="button" data-action="auth-tab" data-mode="register" id="authTabRegister" class="py-2 rounded-xl text-xs sm:text-sm font-bold tap-btn text-slate-400 hover:text-white">
                            Тіркелу
                        </button>
                    </div>

                    <!-- ЛОГИН / ПАРОЛЬМЕН КІРУ -->
                    <form id="loginForm" class="space-y-3.5">
                        <div>
                            <label for="loginEmail" class="block text-xs font-bold text-slate-300 mb-1">Email</label>
                            <input id="loginEmail" type="email" required autocomplete="email" placeholder="user@domain.kz" class="w-full rounded-xl bg-slate-950/90 border border-white/15 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400">
                        </div>
                        <div>
                            <label for="loginPassword" class="block text-xs font-bold text-slate-300 mb-1">Құпиясөз</label>
                            <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="••••••••" class="w-full rounded-xl bg-slate-950/90 border border-white/15 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400">
                        </div>
                        <button type="submit" id="loginSubmitBtn" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-sm font-extrabold tap-btn">
                            Кіру
                        </button>
                    </form>

                    <!-- ТІРКЕЛУ -->
                    <form id="registerForm" class="space-y-3 hidden">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label for="regName" class="block text-xs font-bold text-slate-300 mb-1">Аты-жөні</label>
                                <input id="regName" type="text" required placeholder="Аты-жөні" class="w-full rounded-xl bg-slate-950/90 border border-white/15 px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400">
                            </div>
                            <div>
                                <label for="regRole" class="block text-xs font-bold text-slate-300 mb-1">Рөл</label>
                                <select id="regRole" class="w-full rounded-xl bg-slate-950/90 border border-white/15 px-3 py-2 text-sm text-white font-semibold focus:outline-none focus:border-emerald-400">
                                    <option value="student">Оқушы</option>
                                    <option value="teacher">Мұғалім</option>
                                    <option value="admin">Админ</option>
                                </select>
                            </div>
                        </div>
                        <div id="regGradeWrap">
                            <label for="regGrade" class="block text-xs font-bold text-slate-300 mb-1">Сынып (1–11)</label>
                            <select id="regGrade" class="w-full rounded-xl bg-slate-950/90 border border-white/15 px-3 py-2 text-sm text-white font-semibold focus:outline-none focus:border-emerald-400"></select>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label for="regEmail" class="block text-xs font-bold text-slate-300 mb-1">Email</label>
                                <input id="regEmail" type="email" required placeholder="user@domain.kz" class="w-full rounded-xl bg-slate-950/90 border border-white/15 px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400">
                            </div>
                            <div>
                                <label for="regPassword" class="block text-xs font-bold text-slate-300 mb-1">Құпиясөз</label>
                                <input id="regPassword" type="password" required minlength="6" placeholder="Кемінде 6 таңба" class="w-full rounded-xl bg-slate-950/90 border border-white/15 px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400">
                            </div>
                        </div>
                        <button type="submit" id="registerSubmitBtn" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-sm font-extrabold tap-btn">
                            Тіркелу
                        </button>
                    </form>

                    <!-- ШЫНАЙЫ GOOGLE AUTH -->
                    <div class="mt-4 pt-4 border-t border-white/10">
                        <button type="button" id="googleSignInBtn" data-action="google-auth" class="w-full py-2.5 px-4 rounded-xl bg-white hover:bg-slate-100 text-slate-900 text-sm font-extrabold flex items-center justify-center gap-2.5 tap-btn">
                            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M23.49 12.27c0-.78-.07-1.53-.2-2.27H12v4.51h6.47c-.29 1.5-1.14 2.76-2.4 3.6v3h3.88c2.27-2.09 3.54-5.17 3.54-8.84z"/>
                                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.26v3.1C3.23 21.31 7.29 24 12 24z"/>
                                <path fill="#FBBC05" d="M5.28 14.29c-.24-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.61H1.26C.46 8.2 0 10.04 0 12s.46 3.8 1.26 5.39l4.02-3.1z"/>
                                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.29 0 3.23 2.69 1.26 6.61l4.02 3.1c.95-2.85 3.6-4.96 6.72-4.96z"/>
                            </svg>
                            <span>Google аккаунтпен кіру</span>
                        </button>
                    </div>
                </div>

                <div id="authErrorBox" class="hidden mt-3 px-3.5 py-2.5 rounded-xl bg-rose-500/15 border border-rose-500/40 text-xs text-rose-200 font-medium"></div>
            </div>
        </div>
    </div>

    <!-- =================================================================== -->
    <!-- 2. GOOGLE-МЕН АЛҒАШ КІРГЕНДЕ РӨЛ ТАҢДАУ ТЕРЕЗЕСІ                    -->
    <!-- =================================================================== -->
    <div id="roleOnboardingModal" class="fixed inset-0 z-[55] hidden items-center justify-center p-4 bg-[#070B14]/90 backdrop-blur-xl">
        <div class="w-full max-w-md rounded-3xl glass-elevated p-6 space-y-4 anim-tile">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-extrabold text-white">Рөлді бекіту</h2>
                <span id="onboardEmailTag" class="text-xs text-emerald-400 font-semibold truncate max-w-[190px]"></span>
            </div>
            <form id="roleOnboardingForm" class="space-y-3.5">
                <div>
                    <label for="onboardName" class="block text-xs font-bold text-slate-300 mb-1">Аты-жөні</label>
                    <input id="onboardName" type="text" required class="w-full rounded-xl bg-slate-950 border border-white/15 px-3.5 py-2.5 text-sm text-white">
                </div>
                <div>
                    <label for="onboardRole" class="block text-xs font-bold text-slate-300 mb-1">Рөл</label>
                    <select id="onboardRole" class="w-full rounded-xl bg-slate-950 border border-white/15 px-3.5 py-2.5 text-sm text-white font-semibold">
                        <option value="student">Оқушы</option>
                        <option value="teacher">Мұғалім</option>
                        <option value="admin">Админ</option>
                    </select>
                </div>
                <div id="onboardGradeWrap">
                    <label for="onboardGrade" class="block text-xs font-bold text-slate-300 mb-1">Сынып (1–11)</label>
                    <select id="onboardGrade" class="w-full rounded-xl bg-slate-950 border border-white/15 px-3.5 py-2.5 text-sm text-white font-semibold"></select>
                </div>
                <button type="submit" id="onboardSaveBtn" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-sm font-extrabold tap-btn">
                    Сақтау
                </button>
            </form>
        </div>
    </div>

    <!-- =================================================================== -->
    <!-- 3. НЕГІЗГІ ЖҰМЫС ОРТАСЫ (РӨЛДІК ОҚШАУЛАУ)                          -->
    <!-- =================================================================== -->
    <div id="appShell" class="hidden min-h-screen flex flex-col">
        <header class="sticky top-0 z-30 glass-panel border-b border-white/10 px-3 sm:px-6 h-16 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 shrink-0">
                <button type="button" data-action="toggle-mobile-nav" class="lg:hidden p-2 rounded-xl bg-white/5 border border-white/10 text-slate-200 tap-btn" aria-label="Мәзір">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <button type="button" data-action="go-home" class="flex items-center gap-2.5 tap-btn focus:outline-none">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500/20 to-amber-500/20 border border-emerald-400/35 flex items-center justify-center">
                        <svg class="w-5 h-5" viewBox="0 0 32 32" fill="none">
                            <defs>
                                <linearGradient id="bolashaqEmblemGrad2" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#10B981"/>
                                    <stop offset="100%" stop-color="#F59E0B"/>
                                </linearGradient>
                            </defs>
                            <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" stroke="url(#bolashaqEmblemGrad2)" stroke-width="2.2" fill="rgba(16,185,129,0.1)"/>
                            <path d="M11 10.5H17.5C19.433 10.5 21 12.067 21 14C21 15.1 20.48 16.08 19.68 16.72C20.78 17.34 21.5 18.5 21.5 19.85C21.5 21.86 19.86 23.5 17.85 23.5H11V10.5Z" stroke="#F8FAFC" stroke-width="2" stroke-linejoin="round"/>
                            <path d="M11 16.8H18.2" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <span class="brand-wordmark text-base sm:text-lg">BOLASHAQ</span>
                </button>
            </div>

            <!-- ОҢ ЖАҚ СТАТУС ПАНЕЛІ: iPhone Network + Рөл + Токен + Кабинет -->
            <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
                <!-- НАҚТЫ УАҚЫТТАҒЫ IPHONE СТИЛІНДЕГІ ЖЕЛІ / WI-FI ИНДИКАТОРЫ -->
                <div id="headerNetIndicator" class="px-2.5 py-1.5 rounded-xl bg-slate-950/90 border border-white/10 flex items-center gap-1.5 text-[11px] font-bold text-slate-100"></div>

                <!-- ТІРКЕЛГЕН БІР ҒАНА РӨЛ БЕЛГІСІ -->
                <span id="lockedRoleBadge" class="px-2.5 py-1.5 rounded-xl bg-emerald-500/15 border border-emerald-400/30 text-emerald-300 text-xs font-extrabold"></span>

                <!-- ТОКЕН БАЛАНСЫ -->
                <button type="button" data-action="nav-tab" data-tab="ai" class="px-2.5 py-1.5 rounded-xl bg-amber-500/15 border border-amber-400/30 text-amber-300 text-xs font-extrabold tabular-nums tap-btn">
                    <span id="headerTokensVal">0</span> <span class="hidden sm:inline font-semibold">токен</span>
                </button>

                <!-- ЖЕКЕ КАБИНЕТ -->
                <button type="button" data-action="nav-tab" data-tab="profile" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/15 border border-white/10 text-xs font-bold text-white tap-btn">
                    <span id="headerProfileName">Кабинет</span>
                </button>
            </div>
        </header>

        <div class="flex-1 flex relative">
            <div id="mobileNavOverlay" data-action="close-mobile-nav" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden"></div>

            <aside id="sidebarNav" class="fixed lg:static inset-y-0 left-0 z-40 w-64 glass-panel border-r border-white/10 flex flex-col justify-between transform -translate-x-full lg:translate-x-0 transition-transform duration-200 pt-16 lg:pt-0 shrink-0">
                <div class="p-3.5 space-y-3 overflow-y-auto flex-1">
                    <div id="sidebarUserCard" class="p-3.5 rounded-2xl bg-gradient-to-br from-slate-950 to-emerald-950/40 border border-white/10"></div>
                    <nav id="sidebarMenuItems" class="space-y-1"></nav>
                </div>

                <div class="p-3.5 border-t border-white/10 space-y-2">
                    <button type="button" data-action="logout" class="w-full py-2.5 px-3 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/30 text-xs font-extrabold text-rose-300 tap-btn">
                        Системадан шығу
                    </button>
                </div>
            </aside>

            <main class="flex-1 min-w-0 p-4 sm:p-6 max-w-6xl mx-auto w-full">
                <div id="mainWorkspace"></div>
            </main>
        </div>
    </div>

    <!-- =================================================================== -->
    <!-- 4. ТОЛЫҚ ЭКРАНДЫ ПРЕЗЕНТАЦИЯ ОЙНАТҚЫШ (НОУТБУК / ТАҚТА / ТЕЛЕФОН)    -->
    <!-- =================================================================== -->
    <div id="fullscreenPresModal" class="fixed inset-0 z-[70] hidden bg-[#050811] text-white flex-col">
        <div class="px-4 sm:px-6 h-14 border-b border-white/10 bg-slate-950/90 flex items-center justify-between gap-3 shrink-0">
            <div class="flex items-center gap-3 min-w-0">
                <span id="fsPresBadge" class="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 text-xs font-extrabold shrink-0">1 / 1</span>
                <h3 id="fsPresTitle" class="text-sm sm:text-base font-extrabold truncate"></h3>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button type="button" data-action="fs-native-toggle" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-bold tap-btn">
                    Толық экран
                </button>
                <button type="button" data-action="fs-close" class="px-3 py-1.5 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-200 text-xs font-bold tap-btn">
                    Жабу
                </button>

        // =====================================================================
        // 1. НАҚТЫ УАҚЫТТАҒЫ IPHONE СТИЛІНДЕГІ ЖЕЛІ / WI-FI ИНДИКАТОРЫ
        // =====================================================================
        function getNetworkMetrics() {
            const online = navigator.onLine;
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection || null;
            if (!online) {
                return { online: false, isWifi: false, bars: 0, label: "Желі жоқ" };
            }

            const rawType = conn?.type ? String(conn.type).toLowerCase() : "";
            const effType = conn?.effectiveType ? String(conn.effectiveType).toLowerCase() : "4g";
            const downlink = typeof conn?.downlink === "number" ? conn.downlink : 10;
            const rtt = typeof conn?.rtt === "number" ? conn.rtt : 40;

            const isWifi = rawType === "wifi" || rawType === "ethernet";

            if (isWifi) {
                let bars = 3;
                if (downlink < 1.5 || rtt > 350) bars = 1;
                else if (downlink < 6 || rtt > 140) bars = 2;
                const speedText = typeof conn?.downlink === "number" ? `${downlink.toFixed(1)} Мбит/с` : "Wi-Fi";
                return { online: true, isWifi: true, bars, label: `Wi-Fi • ${speedText}` };
            }

            let bars = 4;
            if (effType === "slow-2g" || rtt > 900) bars = 1;
            else if (effType === "2g" || rtt > 450) bars = 2;
            else if (effType === "3g" || rtt > 180 || downlink < 3) bars = 3;

            const netTag = effType === "4g" ? "LTE" : effType.toUpperCase();
            return { online: true, isWifi: false, bars, label: netTag };
        }

        function buildIphoneNetworkHTML() {
            const m = getNetworkMetrics();
            if (!m.online) {
                return `
                    <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                    <span class="text-rose-400">0</span>
                `;
            }

            if (m.isWifi) {
                const c1 = m.bars >= 1 ? "#34D399" : "#334155";
                const c2 = m.bars >= 2 ? "#34D399" : "#334155";
                const c3 = m.bars >= 3 ? "#34D399" : "#334155";
                return `
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 20 16" fill="none">
                        <path d="M1.5 5.2C6.3 1.2 13.7 1.2 18.5 5.2" stroke="${c3}" stroke-width="2" stroke-linecap="round"/>
                        <path d="M4.6 8.6C7.8 6 12.2 6 15.4 8.6" stroke="${c2}" stroke-width="2" stroke-linecap="round"/>
                        <path d="M7.8 11.8C9.1 10.7 10.9 10.7 12.2 11.8" stroke="${c1}" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="10" cy="14.2" r="1.3" fill="${c1}"/>
                    </svg>
                    <span class="text-[11px] font-bold text-slate-200 whitespace-nowrap">${escapeHtml(m.label)}</span>
                `;
            }

            const heights = [4, 7, 10, 13];
            const barsSvg = heights.map((h, i) => {
                const active = (i + 1) <= m.bars;
                return `<rect x="${i * 4.2 + 1}" y="${14 - h}" width="2.8" height="${h}" rx="1" fill="${active ? "#F8FAFC" : "#334155"}"/>`;
            }).join("");

            return `
                <svg class="w-4 h-3.5 shrink-0" viewBox="0 0 18 15" fill="none">${barsSvg}</svg>
                <span class="text-[11px] font-bold text-slate-200 whitespace-nowrap">${escapeHtml(m.label)}</span>
            `;
        }

        function updateNetworkIndicators() {
            const html = buildIphoneNetworkHTML();
            const hEl = document.getElementById("headerNetIndicator");
            const gEl = document.getElementById("gateNetIndicator");
            if (hEl) hEl.innerHTML = html;
            if (gEl) gEl.innerHTML = html;
        }

        function initNetworkListeners() {
            updateNetworkIndicators();
            window.addEventListener("online", updateNetworkIndicators);
            window.addEventListener("offline", updateNetworkIndicators);
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (conn && typeof conn.addEventListener === "function") {
                conn.addEventListener("change", updateNetworkIndicators);
            }
            setInterval(updateNetworkIndicators, 5000);
        }

        // =====================================================================
        // 2. АУТЕНТИФИКАЦИЯ ЖӘНЕ FIRESTORE НАҚТЫ УАҚЫТ БАЙЛАНЫСЫ
        // =====================================================================

            const regGrade = document.getElementById("regGrade");

            const isLogin = mode === "login";

            document.getElementById("registerForm").classList.toggle("hidden", isLogin);
            document.getElementById("authTabLogin").className = `py-2 rounded-xl text-xs sm:text-sm font-bold tap-btn ${isLogin ? "bg-emerald-500 text-slate-950" : "text-slate-400 hover:text-white"}`;
            document.getElementById("authTabRegister").className = `py-2 rounded-xl text-xs sm:text-sm font-bold tap-btn ${!isLogin ? "bg-emerald-500 text-slate-950" : "text-slate-400 hover:text-white"}`;
            hideAuthError();
        }

        function showAuthError(msg) {
            const box = document.getElementById("authErrorBox");
            box.textContent = msg;
            box.classList.remove("hidden");
        }

        function hideAuthError() {
            document.getElementById("authErrorBox").classList.add("hidden");
        }

        function clearFirestoreListeners() {
            state.unsubs.forEach(fn => {
                try { fn(); } catch {}
            });
            state.unsubs = [];
        }

        function subscribeUserAndCollections(uid) {
            clearFirestoreListeners();

            // 1) Пайдаланушының жеке профилі мен API кілттерін тікелей Firestore-дан бақылау
            const userRef = doc(db, "users", uid);
            const unsubProfile = onSnapshot(userRef, (snap) => {
                if (!snap.exists()) {
                    openRoleOnboarding();
                    return;
                }
                const data = snap.data();
                const isFirstLoad = !state.profile;
                state.profile = { uid, ...data };

                if (!state.activeTab) {
                    state.activeTab = defaultTabForRole(state.profile.role);
                }
                if (state.profile.role === "student" && state.profile.grade) {
                    state.selectedGrade = Number(state.profile.grade);
                }

                closeRoleOnboarding();
                document.getElementById("authGate").classList.add("hidden");
                const shell = document.getElementById("appShell");
                const wasHidden = shell.classList.contains("hidden");
                shell.classList.remove("hidden");

                renderApp();
                if (isFirstLoad || wasHidden) {
                    triggerIphoneUnlockAnimation();
                }
            }, (err) => {
                toast("Firestore қатесі", err.message, "error");
            });
            state.unsubs.push(unsubProfile);

            // 2) Квиздер
            const unsubQuizzes = onSnapshot(collection(db, "quizzes"), (snap) => {
                state.quizzes = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
                if (state.profile) renderWorkspace();
            });
            state.unsubs.push(unsubQuizzes);

            // 3) Презентациялар, Зертханалар, Практикалар
            const unsubContent = onSnapshot(collection(db, "content"), (snap) => {
                state.content = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
                if (state.profile) renderWorkspace();
            });
            state.unsubs.push(unsubContent);

            // 4) Оқушы жауаптары / нәтижелері
            const unsubSubs = onSnapshot(collection(db, "submissions"), (snap) => {
                state.submissions = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
                if (state.profile) renderWorkspace();
            });
            state.unsubs.push(unsubSubs);

            // 5) Пайдаланушының жеке ЖИ чаты
            const chatQuery = query(collection(db, "ai_chats"), where("uid", "==", uid));
            const unsubChats = onSnapshot(chatQuery, (snap) => {
                state.aiChats = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));
                if (state.profile && state.activeTab === "ai") renderWorkspace();
            });
            state.unsubs.push(unsubChats);

            // 6) Барлық қолданушылар (Админ үшін)
            const unsubUsers = onSnapshot(collection(db, "users"), (snap) => {
                state.users = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
                if (state.profile && state.profile.role === "admin") renderWorkspace();
            });
            state.unsubs.push(unsubUsers);
        }

        function openRoleOnboarding() {
            const u = state.authUser;
            if (!u) return;
            document.getElementById("onboardEmailTag").textContent = u.email || "";
            document.getElementById("onboardName").value = u.displayName || (u.email ? u.email.split("@")[0] : "");
            const modal = document.getElementById("roleOnboardingModal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeRoleOnboarding() {
            const modal = document.getElementById("roleOnboardingModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        function triggerIphoneUnlockAnimation() {
            const shell = document.getElementById("appShell");
            shell.classList.remove("anim-unlock");
            void shell.offsetWidth;
            shell.classList.add("anim-unlock");

            document.querySelectorAll("#mainWorkspace .glass-panel").forEach((el, idx) => {
                el.classList.remove("anim-tile");
                el.style.animationDelay = `${Math.min(idx * 55, 280)}ms`;
                void el.offsetWidth;
                el.classList.add("anim-tile");
            });
        }

        // =====================================================================
        // 3. РӨЛДІК ОҚШАУЛАУ ЖӘНЕ МӘЗІР
        // =====================================================================
        const ROLE_MENUS = {
            student: [
                { id: "quizzes", label: "Квиздер" },
                { id: "materials", label: "Презентация & Материал" },
                { id: "labs", label: "Зертхана & Практика" },
                { id: "ai", label: "Gemini / ChatGPT" },
                { id: "profile", label: "Жеке кабинет" }
            ],
            teacher: [
                { id: "create_quiz", label: "Квиз құру" },
                { id: "create_pres", label: "Презентация" },
                { id: "create_lab", label: "Зертхана & Практика" },
                { id: "results", label: "Нәтижелер" },
                { id: "ai", label: "Gemini / ChatGPT" },
                { id: "profile", label: "Жеке кабинет" }
            ],
            admin: [
                { id: "users", label: "Қолданушылар" },
                { id: "overview", label: "Контент бақылау" },
                { id: "ai", label: "Gemini / ChatGPT" },
                { id: "profile", label: "Жеке кабинет" }
            ]
        };

        function defaultTabForRole(role) {
            return (ROLE_MENUS[role] && ROLE_MENUS[role][0]?.id) || "profile";
        }

        function roleLabel(role) {
            return { student: "Оқушы", teacher: "Мұғалім", admin: "Админ" }[role] || "Пайдаланушы";
        }

        function renderApp() {
            const p = state.profile;
            if (!p) return;

            document.getElementById("lockedRoleBadge").textContent = roleLabel(p.role);
            document.getElementById("headerTokensVal").textContent = Number(p.tokens || 0).toLocaleString("ru-RU");
            document.getElementById("headerProfileName").textContent = (p.name || "Кабинет").split(" ")[0];

            document.getElementById("sidebarUserCard").innerHTML = `
                <div class="flex items-center justify-between text-[11px]">
                    <span class="font-extrabold uppercase tracking-wider text-emerald-400">${roleLabel(p.role)}</span>
                    ${p.role === "student" && p.grade ? `<span class="px-2 py-0.5 rounded-md bg-white/10 text-amber-300 font-bold">${p.grade}-сынып</span>` : ""}
                </div>
                <div class="text-sm font-extrabold text-white mt-1 truncate">${escapeHtml(p.name || "")}</div>
                <div class="text-[11px] text-slate-400 truncate">${escapeHtml(p.email || "")}</div>
            `;

            const menu = ROLE_MENUS[p.role] || [];
            if (!menu.some(m => m.id === state.activeTab)) {
                state.activeTab = defaultTabForRole(p.role);
            }

            document.getElementById("sidebarMenuItems").innerHTML = menu.map(item => {
                const active = item.id === state.activeTab;
                return `
                    <button type="button" data-action="nav-tab" data-tab="${item.id}" class="w-full text-left px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-bold tap-btn ${
                        active
                            ? "bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 shadow-md"
                            : "text-slate-300 hover:bg-white/[0.06] hover:text-white"
                    }">
                        ${escapeHtml(item.label)}
                    </button>
                `;
            }).join("");

            renderWorkspace();
        }

        function renderWorkspace() {
            const p = state.profile;
            const host = document.getElementById("mainWorkspace");
            if (!p || !host) return;

            const key = `${p.role}:${state.activeTab}`;
            const views = {
                "student:quizzes": renderStudentQuizzes,
                "student:materials": renderStudentMaterials,
                "student:labs": renderStudentLabsAndPractice,
                "student:ai": renderRealAIChat,
                "student:profile": renderUserProfile,

                "teacher:create_quiz": renderTeacherQuizBuilder,
                "teacher:create_pres": renderTeacherPresentationBuilder,
                "teacher:create_lab": renderTeacherLabPracticeBuilder,
                "teacher:results": renderTeacherResults,
                "teacher:ai": renderRealAIChat,
                "teacher:profile": renderUserProfile,

                "admin:users": renderAdminUsers,
                "admin:overview": renderAdminContentOverview,
                "admin:ai": renderRealAIChat,
                "admin:profile": renderUserProfile
            };

            host.innerHTML = (views[key] || renderUserProfile)();
            if (state.quizRunner) renderActiveQuizRunner();
        }

        // =====================================================================
        // 4. ОҚУШЫ БӨЛІМДЕРІ (ТЕК НАҚТЫ FIRESTORE ДЕРЕКТЕРІ)
        // =====================================================================
        function renderStudentQuizzes() {
            const grade = Number(state.profile.grade || 9);
            const list = state.quizzes.filter(q => Number(q.grade) === grade);

            return `
                <div class="flex items-center justify-between gap-3 mb-5">
                    <h1 class="text-lg sm:text-xl font-extrabold text-white">Квиздер (${grade}-сынып)</h1>
                    <span class="px-3 py-1 rounded-xl bg-white/5 border border-white/10 text-xs font-bold text-slate-300">${list.length}</span>
                </div>

                <div id="quizRunnerHost" class="mb-5"></div>

                ${list.length === 0 ? `
                    <div class="glass-panel rounded-2xl p-8 text-center text-xs sm:text-sm text-slate-400">
                        ${grade}-сыныпқа арналған квиз әлі жүктелмеген.
                    </div>
                ` : `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${list.map(q => `
                            <div class="glass-panel rounded-2xl p-5 flex flex-col justify-between gap-4 anim-tile">
                                <div>
                                    <div class="flex items-center justify-between text-xs mb-1">
                                        <span class="font-bold text-emerald-400">${escapeHtml(q.subject)}</span>
                                        <span class="text-slate-400">${(q.questions || []).length} сұрақ</span>
                                    </div>
                                    <h3 class="text-base font-extrabold text-white">${escapeHtml(q.title)}</h3>
                                    <div class="text-[11px] text-slate-400 mt-1">Мұғалім: ${escapeHtml(q.teacherName || "")}</div>
                                </div>
                                <button type="button" data-action="play-quiz" data-quiz-id="${q.id}" class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold tap-btn">
                                    Бастау
                                </button>
                            </div>
                        `).join("")}
                    </div>
                `}
            `;
        }

        function startQuizRunner(quizId) {
            const quiz = state.quizzes.find(q => q.id === quizId);
            if (!quiz || !quiz.questions?.length) return;
            clearInterval(state.quizTimer);
            state.quizRunner = {
                quiz,
                index: 0,
                score: 0,
                streak: 0,
                correct: 0,
                timeLeft: Number(quiz.timeLimit || 25),
                answered: false,
                chosen: null,
                finished: false
            };
            renderActiveQuizRunner();
            state.quizTimer = setInterval(() => {
                const r = state.quizRunner;
                if (!r || r.answered || r.finished) return;
                r.timeLeft -= 1;
                const el = document.getElementById("qrTimer");
                if (el) el.textContent = `${r.timeLeft}с`;
                if (r.timeLeft <= 0) {
                    clearInterval(state.quizTimer);
                    submitQuizAnswer(-1);
                }
            }, 1000);
        }

        function submitQuizAnswer(optIdx) {
            const r = state.quizRunner;
            if (!r || r.answered || r.finished) return;
            clearInterval(state.quizTimer);
            const cur = r.quiz.questions[r.index];
            r.answered = true;
            r.chosen = optIdx;
            if (optIdx === Number(cur.ans)) {
                r.correct += 1;
                r.streak += 1;
                const bonus = Math.max(0, r.timeLeft * 4);
                r.score += Math.round((100 + bonus) * (r.streak >= 3 ? 1.5 : 1));
            } else {
                r.streak = 0;
            }
            renderActiveQuizRunner();
        }

        async function nextQuizQuestion() {
            const r = state.quizRunner;
            if (!r) return;
            if (r.index + 1 < r.quiz.questions.length) {
                r.index += 1;
                r.timeLeft = Number(r.quiz.timeLimit || 25);
                r.answered = false;
                r.chosen = null;
                renderActiveQuizRunner();
                state.quizTimer = setInterval(() => {
                    if (!state.quizRunner || state.quizRunner.answered || state.quizRunner.finished) return;
                    state.quizRunner.timeLeft -= 1;
                    const el = document.getElementById("qrTimer");
                    if (el) el.textContent = `${state.quizRunner.timeLeft}с`;
                    if (state.quizRunner.timeLeft <= 0) {
                        clearInterval(state.quizTimer);
                        submitQuizAnswer(-1);
                    }
                }, 1000);
            } else {
                clearInterval(state.quizTimer);
                r.finished = true;
                renderActiveQuizRunner();
                try {
                    await addDoc(collection(db, "submissions"), {
                        studentUid: state.profile.uid,
                        studentName: state.profile.name,
                        grade: state.profile.grade,
                        teacherUid: r.quiz.teacherUid || "",
                        itemType: "quiz",
                        itemId: r.quiz.id,
                        title: r.quiz.title,
                        subject: r.quiz.subject,
                        score: r.score,
                        correct: r.correct,

            if (r.finished) {

                    <div class="flex items-center justify-between text-xs">

        async function executeRealAIRequest(provider, promptText) {
            const p = state.profile;
            if (!p) throw new Error("Аккаунт табылмады.");
            if (Number(p.tokens || 0) <= 0) throw new Error("Токен балансы 0.");

            if (provider === "Gemini") {
                const key = (p.geminiKey || "").trim();
                if (!key) throw new Error("Gemini API кілті сақталмаған (Жеке кабинет -> API кілттері).");

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`;
                const resp = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });
                const data = await resp.json();
                if (!resp.ok) {
                    throw new Error(data.error?.message || `Gemini HTTP ${resp.status}`);
                }
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) throw new Error("Gemini бос жауап қайтарды.");
                const tokens = Number(data.usageMetadata?.totalTokenCount || Math.max(8, Math.ceil((promptText.length + text.length) / 3.5)));
                return { text, tokens };
            }

            const openaiKey = (p.openaiKey || "").trim();
            if (!openaiKey) throw new Error("OpenAI (ChatGPT) API кілті сақталмаған (Жеке кабинет -> API кілттері).");

            const resp = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${openaiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [{ role: "user", content: promptText }]
                })
            });
            const data = await resp.json();
            if (!resp.ok) {
                throw new Error(data.error?.message || `OpenAI HTTP ${resp.status}`);
            }
            const text = data.choices?.[0]?.message?.content;
            if (!text) throw new Error("ChatGPT бос жауап қайтарды.");
            const tokens = Number(data.usage?.total_tokens || Math.max(8, Math.ceil((promptText.length + text.length) / 3.5)));
            return { text, tokens };
        }

        function renderMediaPreview(imageUrl, videoUrl) {
            if (!imageUrl && !videoUrl) return "";
            return `

        function renderVideoEmbed(url, heightClass = "h-56") {
            const clean = String(url || "").trim();
            if (!clean) return "";
            const ytMatch = clean.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
            if (ytMatch) {
                return `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" class="w-full ${heightClass} rounded-xl border border-white/10" allowfullscreen loading="lazy"></iframe>`;
            }
            return `<video src="${escapeHtml(clean)}" controls class="w-full ${heightClass} rounded-xl border border-white/10 bg-black"></video>`;
        }

        function compressImageFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const maxSide = 960;
                        let w = img.width;
                        let h = img.height;
                        if (w > maxSide || h > maxSide) {
                            if (w > h) {
                                h = Math.round((h * maxSide) / w);
                                w = maxSide;
                            } else {
                                w = Math.round((w * maxSide) / h);
                                h = maxSide;
                            }
                        }
                        const canvas = document.createElement("canvas");
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL("image/jpeg", 0.78));
                    };
                    img.onerror = reject;
                    img.src = reader.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function toast(title, body, type = "info") {
            const host = document.getElementById("toastContainer");
            const border = {
                success: "border-l-4 border-l-emerald-400",
                error: "border-l-4 border-l-rose-500",
                info: "border-l-4 border-l-amber-400"
            }[type] || "border-l-4 border-l-emerald-400";

            const el = document.createElement("div");
            el.className = `anim-toast pointer-events-auto glass-elevated rounded-2xl px-4 py-3 shadow-2xl ${border}`;
            el.innerHTML = `
                <div class="text-xs font-extrabold text-white">${escapeHtml(title)}</div>
                <div class="text-xs text-slate-300 mt-0.5">${escapeHtml(body)}</div>
            `;
            host.appendChild(el);
            setTimeout(() => {
                el.style.opacity = "0";
                el.style.transition = "opacity 0.2s ease";
                setTimeout(() => el.remove(), 220);
            }, 2800);
        }

        function setBtnBusy(btn, busy, label = "") {
            if (!btn) return;
            if (busy) {
                if (!btn.dataset.prev) btn.dataset.prev = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `<span class="spinner mr-1.5"></span><span>${escapeHtml(label)}</span>`;
            } else {
                btn.disabled = false;
                if (btn.dataset.prev) {
                    btn.innerHTML = btn.dataset.prev;
                    delete btn.dataset.prev;
                }
            }
        }

        function escapeHtml(v) {
            if (v === null || v === undefined) return "";
            return String(v)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        // 10. БАРЛЫҚ ОҚИҒАЛАРДЫ ДЕЛЕГАЦИЯЛАУ
        // =====================================================================
        function bindAllEvents() {
            document.addEventListener("click", async (e) => {
                const btn = e.target.closest("[data-action]");
                if (!btn) return;
                const action = btn.dataset.action;

                if (action === "auth-tab") {
                    switchAuthTab(btn.dataset.mode);
                } else if (action === "google-auth") {
                    hideAuthError();
                    setBtnBusy(btn, true, "Google...");
                    try {
                        const provider = new GoogleAuthProvider();
                        provider.setCustomParameters({ prompt: "select_account" });
                        await signInWithPopup(auth, provider);
                    } catch (err) {
                        if (err?.code === "auth/popup-blocked" || err?.code === "auth/operation-not-supported-in-this-environment") {
                            try {
                                const provider = new GoogleAuthProvider();
                                provider.setCustomParameters({ prompt: "select_account" });
                                await signInWithRedirect(auth, provider);
                                return;
                            } catch (e2) {
                                showAuthError(e2.message);
                            }
                        } else if (err?.code !== "auth/popup-closed-by-user") {
                            showAuthError(err.message);
                        }
                    } finally {
                        setBtnBusy(btn, false);
                    }
                } else if (action === "toggle-mobile-nav") {
                    document.getElementById("sidebarNav").classList.toggle("-translate-x-full");
                    document.getElementById("mobileNavOverlay").classList.toggle("hidden");
                } else if (action === "close-mobile-nav") {
                    document.getElementById("sidebarNav").classList.add("-translate-x-full");
                    document.getElementById("mobileNavOverlay").classList.add("hidden");
                } else if (action === "go-home") {
                    if (state.profile) {
                        state.activeTab = defaultTabForRole(state.profile.role);
                        renderApp();
                    }
                } else if (action === "nav-tab") {
                    clearInterval(state.quizTimer);
                    state.quizRunner = null;
                    state.activeTab = btn.dataset.tab;
                    document.getElementById("sidebarNav").classList.add("-translate-x-full");
                    document.getElementById("mobileNavOverlay").classList.add("hidden");
                    renderApp();
                } else if (action === "logout") {
                    clearInterval(state.quizTimer);
                    state.quizRunner = null;
                    clearFirestoreListeners();
                    await signOut(auth);
                    state.authUser = null;
                    state.profile = null;
                    state.activeTab = null;
                    document.getElementById("appShell").classList.add("hidden");
                    document.getElementById("authGate").classList.remove("hidden");
                } else if (action === "play-quiz") {
                    startQuizRunner(btn.dataset.quizId);
                } else if (action === "close-quiz-runner") {
                    clearInterval(state.quizTimer);
                    state.quizRunner = null;
                    renderWorkspace();
                } else if (action === "quiz-opt") {
                    submitQuizAnswer(Number(btn.dataset.idx));
                } else if (action === "quiz-next") {
                    await nextQuizQuestion();
                } else if (action === "add-quiz-q") {
                    state.draftQuizQuestions.push({ q: "", opts: ["", "", "", ""], ans: 0, image: "", video: "" });
                    renderWorkspace();
                } else if (action === "remove-quiz-q") {
                    state.draftQuizQuestions.splice(Number(btn.dataset.idx), 1);
                    renderWorkspace();
                } else if (action === "add-slide") {
                    state.draftSlides.push({ title: "", body: "", image: "", video: "" });
                    renderWorkspace();
                } else if (action === "remove-slide") {
                    state.draftSlides.splice(Number(btn.dataset.idx), 1);
                    renderWorkspace();
                } else if (action === "open-fs-pres") {
                    openFullscreenPresentation(btn.dataset.contentId);
                } else if (action === "fs-close") {
                    closeFullscreenPresentation();
                } else if (action === "fs-prev") {
                    state.fsIndex -= 1;
                    renderFullscreenSlide();
                } else if (action === "fs-next") {
                    state.fsIndex += 1;
                    renderFullscreenSlide();
                } else if (action === "fs-native-toggle") {
                    const modal = document.getElementById("fullscreenPresModal");
                    if (!document.fullscreenElement) {
                        modal.requestFullscreen?.().catch(() => {});
                    } else {
                        document.exitFullscreen?.().catch(() => {});
                    }
                } else if (action === "set-ai-provider") {
                    state.aiProvider = btn.dataset.prov;
                    renderWorkspace();
                } else if (action === "admin-grant-tokens") {
                    const uid = btn.dataset.uid;
                    const target = state.users.find(u => u.uid === uid);
                    if (target) {
                        await updateDoc(doc(db, "users", uid), { tokens: Number(target.tokens || 0) + 2000 });
                        toast("Токен", "+2000", "success");
                    }
                } else if (action === "ai-fill-quiz") {
                    const topic = document.getElementById("qzTitle")?.value.trim() || state.selectedSubject;
                    const grade = document.getElementById("qzGrade")?.value || "9";
                    const subject = document.getElementById("qzSubject")?.value || "Физика";
                    setBtnBusy(btn, true, "ЖИ...");
                    try {
                        const prompt = `Қазақ тілінде ${grade}-сынып ${subject} пәнінен "${topic}" тақырыбына 3 тест сұрағын тек таза JSON форматында жаз: [{"q":"Сұрақ","opts":["А","Б","В","Г"],"ans":0}]`;
                        const res = await executeRealAIRequest(state.aiProvider, prompt);
                        const cleaned = res.text.replace(/```json|```/gi, "").trim();
                        const parsed = JSON.parse(cleaned);
                        if (Array.isArray(parsed) && parsed.length) {
                            state.draftQuizQuestions = parsed.map(item => ({
                                q: item.q || "",
                                opts: Array.isArray(item.opts) && item.opts.length === 4 ? item.opts : ["", "", "", ""],
                                ans: Number(item.ans || 0),
                                image: "",
                                video: ""
                            }));
                            await updateDoc(doc(db, "users", state.profile.uid), { tokens: Math.max(0, Number(state.profile.tokens || 0) - res.tokens) });
                            renderWorkspace();
                            toast("ЖИ Квиз", `-${res.tokens} токен`, "success");
                        }
                    } catch (err) {
                        toast("ЖИ қатесі", err.message, "error");
                    } finally {
                        setBtnBusy(btn, false);
                    }
                } else if (action === "ai-fill-pres") {
                    const topic = document.getElementById("prTitle")?.value.trim() || state.selectedSubject;
                    const grade = document.getElementById("prGrade")?.value || "9";
                    const subject = document.getElementById("prSubject")?.value || "Физика";
                    setBtnBusy(btn, true, "ЖИ...");
                    try {
                        const prompt = `Қазақ тілінде ${grade}-сынып ${subject} пәнінен "${topic}" тақырыбына 4 слайдты тек таза JSON форматында жаз: [{"title":"Слайд тақырыбы","body":"Қысқа нақты тезистер"}]`;
                        const res = await executeRealAIRequest(state.aiProvider, prompt);
                        const cleaned = res.text.replace(/```json|```/gi, "").trim();
                        const parsed = JSON.parse(cleaned);
                        if (Array.isArray(parsed) && parsed.length) {
                            state.draftSlides = parsed.map(s => ({
                                title: s.title || "",
                                body: s.body || "",
                                image: "",
                                video: ""
                            }));
                            await updateDoc(doc(db, "users", state.profile.uid), { tokens: Math.max(0, Number(state.profile.tokens || 0) - res.tokens) });
                            renderWorkspace();
                            toast("ЖИ Слайд", `-${res.tokens} токен`, "success");
                        }
                    } catch (err) {
                        toast("ЖИ қатесі", err.message, "error");
                    } finally {
                        setBtnBusy(btn, false);
                    }
                }
            });

            // Конструктор өрістерін жаңарту
            document.addEventListener("input", (e) => {
                const el = e.target;
                if (el.dataset.qField) {
                    const idx = Number(el.dataset.idx);
                    const f = el.dataset.qField;
                    if (!state.draftQuizQuestions[idx]) return;
                    if (f === "opt") state.draftQuizQuestions[idx].opts[Number(el.dataset.optIdx)] = el.value;
                    else if (f !== "ans") state.draftQuizQuestions[idx][f] = el.value;
                } else if (el.dataset.slField) {
                    const idx = Number(el.dataset.idx);
                    if (state.draftSlides[idx]) state.draftSlides[idx][el.dataset.slField] = el.value;
                }
            });

            document.addEventListener("change", async (e) => {
                const el = e.target;
                if (el.id === "regRole") {
                    document.getElementById("regGradeWrap").classList.toggle("hidden", el.value !== "student");
                } else if (el.id === "onboardRole") {
                    document.getElementById("onboardGradeWrap").classList.toggle("hidden", el.value !== "student");
                } else if (el.dataset.qField === "ans") {
                    const idx = Number(el.dataset.idx);
                    if (state.draftQuizQuestions[idx]) state.draftQuizQuestions[idx].ans = Number(el.value);
                } else if (el.dataset.uploadTarget) {
                    const file = el.files?.[0];
                    if (!file) return;
                    try {
                        const dataUrl = await compressImageFile(file);
                        const target = el.dataset.uploadTarget;
                        if (target === "quiz-img") {
                            state.draftQuizQuestions[Number(el.dataset.idx)].image = dataUrl;
                            renderWorkspace();
                        } else if (target === "slide-img") {
                            state.draftSlides[Number(el.dataset.idx)].image = dataUrl;
                            renderWorkspace();
                        } else if (target === "work-img") {
                            const inp = document.getElementById("wkImageUrl");
                            if (inp) inp.value = dataUrl;
                            toast("Фото", "Жүктелді", "success");
                        }
                    } catch {
                        toast("Қате", "Фото өңделмеді", "error");
                    }
                }
            });

            // Формаларды жіберу
            document.addEventListener("submit", async (e) => {
                const form = e.target;

                if (form.id === "loginForm") {
                    e.preventDefault();
                    hideAuthError();
                    const btn = document.getElementById("loginSubmitBtn");
                    setBtnBusy(btn, true, "Кіру...");
                    try {
                        const email = document.getElementById("loginEmail").value.trim();
                        const pass = document.getElementById("loginPassword").value;
                        await signInWithEmailAndPassword(auth, email, pass);
                    } catch (err) {
                        showAuthError(err.message);
                    } finally {
                        setBtnBusy(btn, false);
                    }
                } else if (form.id === "registerForm") {
                    e.preventDefault();
                    hideAuthError();
                    const btn = document.getElementById("registerSubmitBtn");
                    setBtnBusy(btn, true, "Тіркелу...");
                    try {
                        const name = document.getElementById("regName").value.trim();
                        const role = document.getElementById("regRole").value;
                        const grade = role === "student" ? Number(document.getElementById("regGrade").value) : null;
                        const email = document.getElementById("regEmail").value.trim();
                        const pass = document.getElementById("regPassword").value;

                        const cred = await createUserWithEmailAndPassword(auth, email, pass);
                        await updateProfile(cred.user, { displayName: name });
                        await setDoc(doc(db, "users", cred.user.uid), {
                            name,
                            email,
                            role,
                            grade,
                            tokens: 3000,
                            geminiKey: "",
                            openaiKey: "",
                            createdAt: serverTimestamp()
                        });
                    } catch (err) {
                        showAuthError(err.message);
                    } finally {
                        setBtnBusy(btn, false);
                    }
                } else if (form.id === "roleOnboardingForm") {
                    e.preventDefault();
                    if (!state.authUser) return;
                    const btn = document.getElementById("onboardSaveBtn");
                    setBtnBusy(btn, true, "Сақтау...");
                    try {
                        const name = document.getElementById("onboardName").value.trim();
                        const role = document.getElementById("onboardRole").value;
                        const grade = role === "student" ? Number(document.getElementById("onboardGrade").value) : null;
                        await setDoc(doc(db, "users", state.authUser.uid), {
                            name,
                            email: state.authUser.email || "",
                            role,
                            grade,
                            tokens: 3000,
                            geminiKey: "",
                            openaiKey: "",
                            createdAt: serverTimestamp()
                        });
                    } catch (err) {
                        toast("Қате", err.message, "error");
                    } finally {
                        setBtnBusy(btn, false);
                    }
                } else if (form.id === "teacherCreateQuizForm") {
                    e.preventDefault();
                    const btn = document.getElementById("saveQuizBtn");
                    setBtnBusy(btn, true, "Сақтау...");
                    try {
                        const title = document.getElementById("qzTitle").value.trim();
                        const grade = Number(document.getElementById("qzGrade").value);
                        const subject = document.getElementById("qzSubject").value;
                        const timeLimit = Number(document.getElementById("qzTime").value) || 25;
                        await addDoc(collection(db, "quizzes"), {
                            title,
                            grade,
                            subject,
                            timeLimit,
                            teacherUid: state.profile.uid,
                            teacherName: state.profile.name,
                            questions: state.draftQuizQuestions,
                            createdAtMs: Date.now()
                        });
                        state.draftQuizQuestions = [{ q: "", opts: ["", "", "", ""], ans: 0, image: "", video: "" }];
                        toast("Сақталды", title, "success");
                        renderWorkspace();
                    } catch (err) {
                        toast("Қате", err.message, "error");
                    } finally {
                        setBtnBusy(btn, false);
                    }
                } else if (form.id === "teacherCreatePresForm") {
                    e.preventDefault();
                    const btn = document.getElementById("savePresBtn");
                    setBtnBusy(btn, true, "Сақтау...");
                    try {
                        const title = document.getElementById("prTitle").value.trim();
                        const grade = Number(document.getElementById("prGrade").value);
                        const subject = document.getElementById("prSubject").value;
                        await addDoc(collection(db, "content"), {
                            kind: "presentation",
                            title,
                            grade,
                            subject,
                            teacherUid: state.profile.uid,
                            teacherName: state.profile.name,
                            slides: state.draftSlides,
                            createdAtMs: Date.now()
                        });
                        state.draftSlides = [{ title: "", body: "", image: "", video: "" }];
                        toast("Сақталды", title, "success");
                        renderWorkspace();
                    } catch (err) {
                        toast("Қате", err.message, "error");
                    } finally {
                        setBtnBusy(btn, false);
                    }
                } else if (form.id === "teacherCreateWorkForm") {
                    e.preventDefault();
                    const btn = document.getElementById("saveWorkBtn");
                    setBtnBusy(btn, true, "Сақтау...");
                    try {
                        const kind = document.getElementById("wkKind").value;
                        const grade = Number(document.getElementById("wkGrade").value);
                        const subject = document.getElementById("wkSubject").value;
                        const title = document.getElementById("wkTitle").value.trim();
                        const instructions = document.getElementById("wkInstructions").value.trim();
                        const image = document.getElementById("wkImageUrl").value.trim();
                        const video = document.getElementById("wkVideoUrl").value.trim();
                        await addDoc(collection(db, "content"), {
                            kind,
                            grade,
                            subject,
                            title,
                            instructions,
                            image,
                            video,
                            teacherUid: state.profile.uid,
                            teacherName: state.profile.name,
                            createdAtMs: Date.now()
                        });
                        form.reset();
                        toast("Жарияланды", title, "success");
                    } catch (err) {
                        toast("Қате", err.message, "error");
                    } finally {
                        setBtnBusy(btn, false);
                    }
                } else if (form.classList.contains("student-work-form")) {
                    e.preventDefault();
                    const item = state.content.find(c => c.id === form.dataset.itemId);
                    if (!item) return;
                    const ans = form.querySelector(".work-answer-input").value.trim();
                    try {
                        await addDoc(collection(db, "submissions"), {
                            studentUid: state.profile.uid,
                            studentName: state.profile.name,
                            grade: state.profile.grade,
                            teacherUid: item.teacherUid || "",
                            itemType: item.kind,
                            itemId: item.id,
                            title: item.title,
                            subject: item.subject,
                            answerText: ans,
                            createdAtMs: Date.now()
                        });
                        toast("Жіберілді", item.title, "success");
                    } catch (err) {
                        toast("Қате", err.message, "error");
                    }
                } else if (form.id === "realAiChatForm") {
                    e.preventDefault();
                    const inp = document.getElementById("realAiInput");
                    const promptText = inp.value.trim();
                    if (!promptText) return;
                    inp.value = "";
                    const sendBtn = document.getElementById("realAiSendBtn");
                    setBtnBusy(sendBtn, true, "...");

                    try {
                        await addDoc(collection(db, "ai_chats"), {
                            uid: state.profile.uid,
                            sender: "user",
                            provider: state.aiProvider,
                            text: promptText,
                            createdAtMs: Date.now()
                        });

                        const res = await executeRealAIRequest(state.aiProvider, promptText);
                        const newTokens = Math.max(0, Number(state.profile.tokens || 0) - res.tokens);
                        await updateDoc(doc(db, "users", state.profile.uid), { tokens: newTokens });

                        await addDoc(collection(db, "ai_chats"), {
                            uid: state.profile.uid,
                            sender: "ai",
                            provider: state.aiProvider,
                            text: res.text,
                            tokens: res.tokens,
                            createdAtMs: Date.now() + 1
                        });
                    } catch (err) {
                        toast(`${state.aiProvider} қатесі`, err.message, "error");
                    } finally {
                        setBtnBusy(sendBtn, false);
                    }
                } else if (form.id === "profileUpdateForm") {
                    e.preventDefault();
                    const name = document.getElementById("profNameInput").value.trim();
                    if (!name) return;
                    await updateDoc(doc(db, "users", state.profile.uid), { name });
                    toast("Сақталды", name, "success");
                } else if (form.id === "firestoreApiKeysForm") {
                    e.preventDefault();
                    const btn = document.getElementById("saveFsKeysBtn");
                    setBtnBusy(btn, true, "Сақталуда...");
                    try {
                        const geminiKey = document.getElementById("fsGeminiKey").value.trim();
                        const openaiKey = document.getElementById("fsOpenaiKey").value.trim();
                        await updateDoc(doc(db, "users", state.profile.uid), {
                            geminiKey,
                            openaiKey
                        });
                        toast("Firestore Sync", "API кілттері сақталды", "success");
                    } catch (err) {
                        toast("Қате", err.message, "error");
                    } finally {
                        setBtnBusy(btn, false);
                    }
                }
            });

            // Пернетақта арқылы толық экранды презентацияны басқару
            document.addEventListener("keydown", (e) => {
                if (!state.fsDeck) return;
                if (e.key === "ArrowRight" || e.key === " ") {
                    state.fsIndex += 1;
                    renderFullscreenSlide();
                } else if (e.key === "ArrowLeft") {
                    state.fsIndex -= 1;
                    renderFullscreenSlide();
                } else if (e.key === "Escape") {
                    closeFullscreenPresentation();
                }
            });
        }

        // =====================================================================
        // 11. ІСКЕ ҚОСУ
        // =====================================================================
        window.addEventListener("DOMContentLoaded", async () => {
            populateSelectOptions();
            initNetworkListeners();
            bindAllEvents();

            try {
                await getRedirectResult(auth);
            } catch (err) {
                showAuthError(err.message);
            }

            onAuthStateChanged(auth, (user) => {
                state.authUser = user;
                if (!user) {
                    clearFirestoreListeners();
                    state.profile = null;
                    state.activeTab = null;
                    document.getElementById("appShell").classList.add("hidden");
                    document.getElementById("authGate").classList.remove("hidden");
                    closeRoleOnboarding();
                } else {
                    subscribeUserAndCollections(user.uid);
                }
            });
        });
    </script>
</body>
</html>
