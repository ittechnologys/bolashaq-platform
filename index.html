
<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOLASHAQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.78);
            --glass-border: rgba(255, 255, 255, 0.9);
            --gold-grad: linear-gradient(135deg, #FDE047 0%, #F59E0B 50%, #EA580C 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(15, 23, 42, 0.08), transparent 42%),
                radial-gradient(circle at 90% 15%, rgba(30, 64, 175, 0.09), transparent 44%),
                linear-gradient(155deg, #F1F5F9 0%, #E2E8F0 52%, #E8EEF5 100%);
            color: #0F172A;
            overflow-x: hidden;
        }

        /* Пышный сары-қызғылт сары Liquid Glass логотипі */
        .bolashaq-liquid-logo {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            font-weight: 800;
            letter-spacing: 0.05em;
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: 0.2em 0.56em;
            border-radius: 9999px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.68) 0%, rgba(255, 255, 255, 0.06) 46%, rgba(154, 52, 18, 0.28) 100%),
                var(--gold-grad);
            border: 1.5px solid rgba(255, 255, 255, 0.92);
            box-shadow:
                inset 0 3px 6px rgba(255, 255, 255, 0.88),
                inset 0 -5px 11px rgba(124, 45, 18, 0.45),
                0 10px 24px rgba(234, 88, 12, 0.26),
                0 2px 6px rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.24s ease;
            user-select: none;
        }

        .bolashaq-liquid-logo::before {
            content: "";
            position: absolute;
            top: 3px;
            left: 13%;
            right: 13%;
            height: 40%;
            border-radius: 9999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }

        .bolashaq-liquid-logo:hover {
            transform: translateY(-1.5px) scale(1.03);
            box-shadow:
                inset 0 4px 8px rgba(255, 255, 255, 0.94),
                inset 0 -6px 12px rgba(124, 45, 18, 0.52),
                0 14px 30px rgba(234, 88, 12, 0.34);
        }

        .bolashaq-logo-text {
            position: relative;
            z-index: 1;
            color: #FFFFFF;
            text-shadow:
                0 1px 0 rgba(255, 255, 255, 0.55),
                0 2px 5px rgba(124, 45, 18, 0.65);
        }

        .liquid-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(145%);
            -webkit-backdrop-filter: blur(16px) saturate(145%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 26px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        /* iPhone экран блоктан шыққандағы иконка/блоктардың қону анимациясы */
        @keyframes iosUnlockSettle {
            0% {
                opacity: 0;
                transform: scale(1.16) translateY(14px);
                filter: blur(4px);
            }
            65% {
                opacity: 1;
                transform: scale(0.985) translateY(-2px);
                filter: blur(0px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
        }

        @keyframes iosItemPop {
            0% {
                opacity: 0;
                transform: scale(0.84) translateY(18px);
            }
            70% {
                opacity: 1;
                transform: scale(1.02) translateY(-2px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes toastSlideIn {
            0% {
                opacity: 0;
                transform: translateX(20px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .anim-unlock-shell {
            animation: iosUnlockSettle 0.48s cubic-bezier(0.2, 0.9, 0.25, 1.05) both;
        }

        .anim-ios-card {
            animation: iosItemPop 0.42s cubic-bezier(0.22, 1.15, 0.36, 1) both;
        }

        .anim-toast {
            animation: toastSlideIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .btn-tactile {
            transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-tactile:active:not(:disabled) {
            transform: scale(0.96);
        }

        .spinner-dot {
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 9999px;
            display: inline-block;
            animation: spinRing 0.6s linear infinite;
            vertical-align: -2px;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #E2E8F0; }
        ::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 9999px; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-900">

    <!-- =================================================================== -->
    <!-- 1. КІРУ / ТІРКЕЛУ ЭКРАНЫ (САЙТҚА КІРГЕНДЕ БІРІНШІ АШЫЛАДЫ)         -->
    <!-- =================================================================== -->
    <div id="entryGate" class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/60 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-3xl rounded-3xl bg-white border border-slate-200 shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-12">

            <!-- Сол жақ панель: Терең көк-графит градиент -->
            <div class="md:col-span-5 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-white p-6 flex flex-col justify-between">
                <div class="space-y-4">
                    <span class="bolashaq-liquid-logo text-xl">
                        <span class="bolashaq-logo-text">BOLASHAQ</span>
                    </span>
                    <div class="text-sm font-bold text-slate-100 leading-snug">
                        1–11 сынып оқулықтары, интерактивті сабақтар және ЖИ студиясы
                    </div>
                    <div class="space-y-2 pt-1 text-xs text-slate-300">
                        <div class="px-3 py-2 rounded-xl bg-white/5 border border-white/10">1. Тіркелу</div>
                        <div class="px-3 py-2 rounded-xl bg-white/5 border border-white/10">2. Логин / Пароль немесе Google</div>
                        <div class="px-3 py-2 rounded-xl bg-white/5 border border-white/10">3. Оқушы • Мұғалім • Админ</div>
                    </div>
                </div>

                <div class="pt-5 mt-5 border-t border-white/10 flex items-center justify-between text-[11px] text-slate-400">
                    <span id="gateDbStatus">Firestore: қосылуда...</span>
                    <span>bolashaq-e214e</span>
                </div>
            </div>

            <!-- Оң жақ панель: Қойындылар, Формалар және Жүйеге өту -->
            <div class="md:col-span-7 p-6 flex flex-col justify-between bg-white">
                <div>
                    <!-- Қойындылар: Кіру / Тіркелу -->
                    <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-2xl border border-slate-200 mb-5">
                        <button type="button" id="gateTabLogin" onclick="setGateMode('login')" class="py-2 rounded-xl text-xs sm:text-sm font-bold btn-tactile bg-white text-slate-900 shadow-xs">
                            Кіру
                        </button>
                        <button type="button" id="gateTabRegister" onclick="setGateMode('register')" class="py-2 rounded-xl text-xs sm:text-sm font-bold btn-tactile text-slate-600 hover:text-slate-900">
                            Тіркелу
                        </button>
                    </div>

                    <!-- ЛОГИН / ПАРОЛЬМЕН КІРУ -->
                    <form id="gateLoginForm" onsubmit="submitGateLogin(event)" class="space-y-3.5">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Логин (Email)</label>
                            <input id="gLoginEmail" type="email" required placeholder="name@bolashaq.kz" class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:border-slate-900">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Пароль</label>
                            <input id="gLoginPass" type="password" required placeholder="••••••••" class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:border-slate-900">
                        </div>
                        <button type="submit" id="gLoginBtn" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold btn-tactile">
                            Кіру
                        </button>
                    </form>

                    <!-- ТІРКЕЛУ -->
                    <form id="gateRegisterForm" onsubmit="submitGateRegister(event)" class="space-y-3 hidden">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Аты-жөні</label>
                                <input id="gRegName" type="text" required placeholder="Аты-жөні" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Рөл</label>
                                <select id="gRegRole" onchange="onGateRoleChange()" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm bg-white font-semibold focus:outline-none focus:border-slate-900">
                                    <option value="student">Оқушы</option>
                                    <option value="teacher">Мұғалім</option>
                                    <option value="admin">Админ</option>
                                </select>
                            </div>
                        </div>
                        <div id="gRegGradeRow" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Сынып (1–11)</label>
                                <select id="gRegGrade" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm bg-white font-semibold focus:outline-none focus:border-slate-900"></select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Пән</label>
                                <select id="gRegSubject" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm bg-white font-semibold focus:outline-none focus:border-slate-900"></select>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Логин (Email)</label>
                                <input id="gRegEmail" type="email" required placeholder="name@bolashaq.kz" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Пароль</label>
                                <input id="gRegPass" type="password" required minlength="6" placeholder="Кемінде 6 таңба" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-slate-900">
                            </div>
                        </div>
                        <button type="submit" id="gRegBtn" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold btn-tactile">
                            Тіркелу
                        </button>
                    </form>

                    <!-- GOOGLE АККАУНТТПЕН КІРУ -->
                    <div class="mt-4 pt-4 border-t border-slate-200">
                        <button type="button" id="gGoogleBtn" onclick="openGoogleAccountChooser()" class="w-full py-2.5 px-4 rounded-xl bg-white hover:bg-slate-50 border border-slate-300 text-slate-800 text-sm font-bold flex items-center justify-center gap-2.5 btn-tactile">
                            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M23.49 12.27c0-.78-.07-1.53-.2-2.27H12v4.51h6.47c-.29 1.5-1.14 2.76-2.4 3.6v3h3.88c2.27-2.09 3.54-5.17 3.54-8.84z"/>
                                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.26v3.1C3.23 21.31 7.29 24 12 24z"/>
                                <path fill="#FBBC05" d="M5.28 14.29c-.24-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.61H1.26C.46 8.2 0 10.04 0 12s.46 3.8 1.26 5.39l4.02-3.1z"/>
                                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.29 0 3.23 2.69 1.26 6.61l4.02 3.1c.95-2.85 3.6-4.96 6.72-4.96z"/>
                            </svg>
                            <span>Google-мен кіру</span>
                        </button>
                    </div>
                </div>

                <!-- Төменгі жол: Жүйеге өту кнопкасы -->
                <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                    <span id="gateStatusNote" class="text-xs text-slate-500">Логин/пароль немесе Google</span>
                    <button type="button" id="enterSystemBtn" onclick="enterSystemNow()" class="px-4 py-2 rounded-xl bg-indigo-950 hover:bg-indigo-900 text-white text-xs font-extrabold btn-tactile">
                        Жүйеге өту →
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- =================================================================== -->
    <!-- 2. GOOGLE АККАУНТЫН ТАҢДАУ ТЕРЕЗЕСІ ("Google аккаунтын таңдаңыз")    -->
    <!-- =================================================================== -->
    <div id="googleChooserModal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4 bg-slate-950/65 backdrop-blur-xs">
        <div class="w-full max-w-md rounded-2xl bg-white border border-slate-200 shadow-2xl overflow-hidden anim-ios-card">
            <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.49 12.27c0-.78-.07-1.53-.2-2.27H12v4.51h6.47c-.29 1.5-1.14 2.76-2.4 3.6v3h3.88c2.27-2.09 3.54-5.17 3.54-8.84z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.26v3.1C3.23 21.31 7.29 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.29c-.24-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.61H1.26C.46 8.2 0 10.04 0 12s.46 3.8 1.26 5.39l4.02-3.1z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.29 0 3.23 2.69 1.26 6.61l4.02 3.1c.95-2.85 3.6-4.96 6.72-4.96z"/>
                    </svg>
                    <span class="text-sm font-extrabold text-slate-900">Google аккаунтын таңдаңыз</span>
                </div>
                <button type="button" onclick="closeGoogleAccountChooser()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-900 hover:bg-slate-100 btn-tactile">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <div class="p-4 space-y-2" id="googleAccountOptions"></div>

            <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-2">
                <button type="button" onclick="triggerFirebaseGooglePopup()" class="text-xs font-bold text-indigo-900 hover:underline btn-tactile">
                    Басқа Google аккаунт
                </button>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="closeGoogleAccountChooser()" class="px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-xs font-bold text-slate-700 btn-tactile">
                        Болдырмау
                    </button>
                    <button type="button" id="googleContinueBtn" onclick="confirmSelectedGoogleAccount()" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold btn-tactile">
                        Жалғастыру
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- =================================================================== -->
    <!-- 3. НЕГІЗГІ ЖҮЙЕ ИНТЕРФЕЙСІ                                         -->
    <!-- =================================================================== -->
    <div id="mainAppShell" class="min-h-screen flex flex-col">
        <header class="sticky top-0 z-30 liquid-glass bg-white/85 border-b border-slate-200/80 px-3 sm:px-6 h-16 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 shrink-0">
                <button type="button" onclick="toggleMobileNav()" class="lg:hidden p-2 rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 btn-tactile" aria-label="Мәзір">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <button type="button" onclick="goDefaultTab()" class="btn-tactile rounded-full focus:outline-none">
                    <span class="bolashaq-liquid-logo text-base sm:text-xl">
                        <span class="bolashaq-logo-text">BOLASHAQ</span>
                    </span>
                </button>
            </div>

            <!-- РӨЛ АУЫСТЫРҒЫШ -->
            <div class="flex items-center bg-slate-100/90 p-1 rounded-2xl border border-slate-200/80">
                <button type="button" id="topRoleStudent" onclick="selectRole('student')" class="px-2.5 sm:px-3.5 py-1.5 rounded-xl text-xs font-bold btn-tactile">Оқушы</button>
                <button type="button" id="topRoleTeacher" onclick="selectRole('teacher')" class="px-2.5 sm:px-3.5 py-1.5 rounded-xl text-xs font-bold btn-tactile">Мұғалім</button>
                <button type="button" id="topRoleAdmin" onclick="selectRole('admin')" class="px-2.5 sm:px-3.5 py-1.5 rounded-xl text-xs font-bold btn-tactile">Админ</button>
            </div>

            <!-- БАСҚАРУ БАТЫРМАЛАРЫ -->
            <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <span id="liveSyncBadge" class="hidden xl:inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-[11px] font-bold text-slate-700">
                    <span id="liveSyncDot" class="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span id="liveSyncLabel">Firestore</span>
                </span>

                <button type="button" onclick="openApiSettingsModal()" class="px-2.5 py-1.5 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-xs font-bold text-slate-800 flex items-center gap-1.5 btn-tactile">
                    <span id="apiKeyDot" class="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span>API</span>
                </button>

                <button type="button" onclick="jumpToTokensView()" class="px-2.5 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-xs font-extrabold text-amber-950 tabular-nums btn-tactile">
                    <span id="headerTokenCount">0</span>
                    <span class="hidden sm:inline font-semibold">токен</span>
                </button>

                <button type="button" onclick="toggleNotificationsDrawer()" class="relative p-2 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 btn-tactile" aria-label="Хабарламалар">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                    </svg>
                    <span id="unreadNotifBadge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-600 text-white text-[10px] font-extrabold flex items-center justify-center">0</span>
                </button>

                <button type="button" onclick="reopenEntryGate('login')" class="px-2.5 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold btn-tactile">
                    <span id="headerUserLabel">Кіру</span>
                </button>
            </div>
        </header>

        <div class="flex-1 flex relative">
            <div id="mobileNavBackdrop" onclick="closeMobileNav()" class="fixed inset-0 bg-slate-950/40 z-30 hidden lg:hidden"></div>

            <aside id="leftSidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-64 liquid-glass bg-white/90 border-r border-slate-200/80 flex flex-col justify-between transform -translate-x-full lg:translate-x-0 transition-transform duration-200 pt-16 lg:pt-0 shrink-0">
                <div class="p-3.5 space-y-3 overflow-y-auto flex-1">

        function loadLocalStore() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? { ...structuredClone(SEED_STATE), ...JSON.parse(raw) } : structuredClone(SEED_STATE);
            } catch {
                return structuredClone(SEED_STATE);
            }
        }

        function saveLocalStore() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
            } catch {
                // ignore
            }
        }

        function loadSession() {
            try {
                const raw = localStorage.getItem(SESSION_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch {
                return null;
            }
        }

        function saveSession(sess) {
            try {
                if (sess) localStorage.setItem(SESSION_KEY, JSON.stringify(sess));
                else localStorage.removeItem(SESSION_KEY);
            } catch {
                // ignore
            }
        }

        function loadRegisteredCredentials() {
            try {
                const raw = localStorage.getItem(AUTH_CREDENTIALS_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch {
                return [];
            }
        }

        function saveRegisteredCredentials(list) {
            try {
                localStorage.setItem(AUTH_CREDENTIALS_KEY, JSON.stringify(list));
            } catch {
                // ignore
            }
        }

        async function syncStateToCloud() {
            saveLocalStore();
            renderShell();
            if (!stateDoc) return;
            try {
                appState.suppressSnapshot = true;
                await setDoc(stateDoc, { ...store, updatedAt: Date.now() }, { merge: true });
                appState.dbOnline = true;
                renderShell();
            } catch {
                appState.dbOnline = false;
                renderShell();
            } finally {
                setTimeout(() => { appState.suppressSnapshot = false; }, 140);
            }
        }

        // =====================================================================
        // ЖҮЙЕЛІК ХАБАРЛАМАЛАР
        // =====================================================================
        function pushSystemNotification(title, body, type = "info") {
            const nowStr = new Date().toLocaleTimeString("kk-KZ", { hour: "2-digit", minute: "2-digit" });
            store.notifications.unshift({
                id: "ntf_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
                title,
                body,
                type,
                time: nowStr,
                read: false
            });
            if (store.notifications.length > 40) store.notifications = store.notifications.slice(0, 40);
            renderNotificationsUI();
            renderToast(title, body, type);
        }

        function renderToast(title, message, type = "info") {
            const stack = document.getElementById("toastStack");
            if (!stack) return;
            const borderCls = {
                success: "border-l-4 border-l-emerald-500",
                warn: "border-l-4 border-l-amber-500",
                error: "border-l-4 border-l-rose-500",
                info: "border-l-4 border-l-indigo-400"
            }[type] || "border-l-4 border-l-amber-500";

            const el = document.createElement("div");
            el.className = `anim-toast pointer-events-auto bg-slate-900 text-white rounded-2xl px-4 py-3 shadow-xl border border-slate-800 ${borderCls}`;
            el.innerHTML = `
                <div class="text-xs font-extrabold text-amber-300">${escapeHtml(title)}</div>
                <div class="text-xs text-slate-200 mt-0.5">${escapeHtml(message)}</div>
            `;
            stack.appendChild(el);
            setTimeout(() => {
                el.style.opacity = "0";
                el.style.transform = "translateX(12px)";
                el.style.transition = "all 0.2s ease";
                setTimeout(() => el.remove(), 210);
            }, 2600);
        }

        function renderNotificationsUI() {
            const unread = store.notifications.filter(n => !n.read).length;
            const badge = document.getElementById("unreadNotifBadge");
            const drawerCount = document.getElementById("drawerNotifCount");
            const listBody = document.getElementById("notifListBody");

            if (badge) {
                badge.textContent = String(unread);
                badge.classList.toggle("hidden", unread === 0);
            }
            if (drawerCount) drawerCount.textContent = String(store.notifications.length);
            if (listBody) {
                listBody.innerHTML = store.notifications.map(n => `
                    <div onclick="readSingleNotification('${n.id}')" class="p-3 rounded-xl border cursor-pointer btn-tactile ${
                        n.read ? "bg-slate-50 border-slate-200 text-slate-600" : "bg-amber-50/70 border-amber-200 text-slate-900"
                    }">
                        <div class="flex items-center justify-between text-[11px] font-bold">
                            <span class="text-amber-800">${escapeHtml(n.title)}</span>
                            <span class="text-slate-400">${escapeHtml(n.time)}</span>
                        </div>
                        <p class="text-xs mt-1">${escapeHtml(n.body)}</p>
                    </div>
                `).join("");
            }
        }

        window.toggleNotificationsDrawer = function (forceOpen = null) {

            if (!drawer) return;

            drawer.classList.toggle("translate-x-full", !shouldOpen);
            if (shouldOpen) renderNotificationsUI();
        };

        window.readSingleNotification = function (id) {
            const item = store.notifications.find(n => n.id === id);
            if (item) item.read = true;

        window.markAllNotificationsRead = function () {

        window.setGateMode = function (mode) {
            const isLogin = mode === "login";
            const loginForm = document.getElementById("gateLoginForm");
            const regForm = document.getElementById("gateRegisterForm");
            if (loginForm) loginForm.classList.toggle("hidden", !isLogin);
            if (regForm) regForm.classList.toggle("hidden", isLogin);

            const loginTab = document.getElementById("gateTabLogin");
            const regTab = document.getElementById("gateTabRegister");
            if (loginTab) {
                loginTab.className = `py-2 rounded-xl text-xs sm:text-sm font-bold btn-tactile ${
                    isLogin ? "bg-white text-slate-900 shadow-xs" : "text-slate-600 hover:text-slate-900"

        window.submitGateRegister = async function (e) {
            e.preventDefault();
            const btn = document.getElementById("gRegBtn");
            setBusy(btn, true, "Тіркелуде...");

            const name = document.getElementById("gRegName").value.trim();
            const role = document.getElementById("gRegRole").value;
            const grade = role === "student" ? parseInt(document.getElementById("gRegGrade").value, 10) : null;
            const subject = document.getElementById("gRegSubject").value;
            const email = document.getElementById("gRegEmail").value.trim().toLowerCase();
            const password = document.getElementById("gRegPass").value;

            const creds = loadRegisteredCredentials().filter(c => c.email !== email);
            creds.push({ email, password, name, role, grade, subject });
            saveRegisteredCredentials(creds);

            let uid = "usr_" + Date.now();
            try {
                if (auth) {
                    const userCred = await createUserWithEmailAndPassword(auth, email, password);
                    uid = userCred.user.uid;
                    await updateProfile(userCred.user, { displayName: name });
                }
            } catch (err) {
                if (err?.code === "auth/email-already-in-use") {
                    setBusy(btn, false);
                    setGateMode("login");
                    document.getElementById("gLoginEmail").value = email;
                    pushSystemNotification("Тіркелген", "Логин және парольмен кіріңіз.", "warn");
                    return;
                }
            }

            const newUser = { id: uid, name, email, role, grade, subject, tokens: 2000, points: 0 };
            store.users = [newUser, ...store.users.filter(u => u.email !== email)];
            appState.role = role;

            setBusy(btn, false);
            setGateMode("login");
            document.getElementById("gLoginEmail").value = email;
            document.getElementById("gLoginPass").value = password;
            document.getElementById("gateStatusNote").textContent = `${name} тіркелді`;

            pushSystemNotification("Тіркелді", `${name} (${roleLabel(role)})`, "success");
            await syncStateToCloud();
        };

        window.submitGateLogin = async function (e) {
            e.preventDefault();
            const btn = document.getElementById("gLoginBtn");
            setBusy(btn, true, "Кіруде...");

            const email = document.getElementById("gLoginEmail").value.trim().toLowerCase();
            const password = document.getElementById("gLoginPass").value;

            let fbUser = null;
            try {
                if (auth) {
                    const res = await signInWithEmailAndPassword(auth, email, password);
                    fbUser = res.user;
                }
            } catch {
                // Тіркелген аккаунттар тізімінен тексеру
            }

            const creds = loadRegisteredCredentials();
            const matchedCred = creds.find(c => c.email === email && c.password === password);
            let profile = store.users.find(u => u.email && u.email.toLowerCase() === email);

            if (!fbUser && !matchedCred && !profile) {
                setBusy(btn, false);
                pushSystemNotification("Қате", "Алдымен тіркеліңіз немесе Google-мен кіріңіз.", "error");
                return;
            }

            if (!profile) {
                profile = {
                    id: fbUser?.uid || ("usr_" + Date.now()),
                    name: matchedCred?.name || fbUser?.displayName || email.split("@")[0],
                    email,
                    role: matchedCred?.role || "student",
                    grade: matchedCred?.grade ?? 9,
                    subject: matchedCred?.subject || store.scope.subject,
                    tokens: 2000,
                    points: 0
                };
                store.users.unshift(profile);
            }

            appState.role = profile.role || "student";
            appState.sessionUser = { id: profile.id, name: profile.name, email: profile.email, role: profile.role };
            saveSession(appState.sessionUser);
            setBusy(btn, false);
            enterWorkspaceWithUnlockAnimation(`${profile.name} жүйеге кірді`);
            await syncStateToCloud();
        };

        // =====================================================================
        // FIREBASE INIT & REAL-TIME FIRESTORE SYNC
        // =====================================================================
        async function bootFirebase() {
            try {
                const firebaseApp = initializeApp(firebaseConfig);
                db = getFirestore(firebaseApp);
                auth = getAuth(firebaseApp);
                stateDoc = doc(db, FIRESTORE_DOC[0], FIRESTORE_DOC[1]);

                onAuthStateChanged(auth, (fbUser) => {
                    if (fbUser) {
                        const found = store.users.find(
                            u => u.id === fbUser.uid || (fbUser.email && u.email?.toLowerCase() === fbUser.email.toLowerCase())
                        );
                        appState.sessionUser = {
                            id: fbUser.uid,
                            name: fbUser.displayName || found?.name || fbUser.email || "Пайдаланушы",
                            email: fbUser.email || found?.email || "",
                            role: found?.role || appState.role
                        };
                        saveSession(appState.sessionUser);
                        appState.role = found?.role || appState.role;
                        hideEntryGate();
                        renderAll();
                    }
                });

                const snap = await getDoc(stateDoc);
                if (!snap.exists()) {
                    await setDoc(stateDoc, { ...SEED_STATE, updatedAt: Date.now() });
                    store = structuredClone(SEED_STATE);
                    saveLocalStore();
                } else {
                    store = { ...structuredClone(SEED_STATE), ...snap.data() };
                    saveLocalStore();
                }

                appState.dbOnline = true;
                setGateDbLabel("Firestore: қосылды");
                renderShell();

                onSnapshot(stateDoc, (docSnap) => {
                    if (appState.suppressSnapshot) return;
                    if (docSnap.exists()) {
                        store = { ...structuredClone(SEED_STATE), ...docSnap.data() };
                        saveLocalStore();
                        appState.dbOnline = true;
                        renderAll();
                    }
                }, () => {
                    appState.dbOnline = false;
                    setGateDbLabel("Локальды база");
                    renderShell();
                });
            } catch {
                appState.dbOnline = false;
                setGateDbLabel("Локальды база");
                renderShell();
            }
        }

        window.launchQuizPlayer = function (quizId) {

        function paintQuizPlayer() {
            const host = document.getElementById("quizPlayerHost");
            if (!host || !activeQuizRun) return;
            const { quiz, idx, points, locked, chosen } = activeQuizRun;
            const curQ = quiz.questions[idx];
            host.innerHTML = `
                <div class="bg-slate-900 text-white rounded-2xl p-5 space-y-4 shadow-xl anim-ios-card">
                    <div class="flex items-center justify-between text-xs">
                        <span class="font-bold text-amber-400">${escapeHtml(quiz.title)} • ${idx + 1}/${quiz.questions.length}</span>
                        <span class="px-3 py-1 rounded-lg bg-slate-800 font-extrabold tabular-nums">${points}</span>
                    </div>
                    <div class="text-base sm:text-lg font-extrabold">${escapeHtml(curQ.q)}</div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        ${curQ.opts.map((opt, oi) => {
                            let cls = "bg-slate-800 hover:bg-slate-700 border-slate-700 text-white";
                            if (locked) {
                                if (oi === curQ.ans) cls = "bg-emerald-600 border-emerald-500 text-white font-bold";
                                else if (oi === chosen) cls = "bg-rose-600 border-rose-500 text-white";
                                else cls = "bg-slate-800/50 border-slate-800 text-slate-400";
                            }
                            return `<button type="button" onclick="pickQuizAnswer(${oi})" ${locked ? "disabled" : ""} class="p-3.5 rounded-xl border text-left text-xs sm:text-sm font-semibold btn-tactile ${cls}">${escapeHtml(opt)}</button>`;
                        }).join("")}
                    </div>
                    ${locked ? `
                        <div class="flex justify-end">
                            <button type="button" onclick="advanceQuizPlayer()" class="px-5 py-2.5 rounded-xl bg-amber-500 text-white text-xs font-bold btn-tactile">
                                ${idx + 1 < quiz.questions.length ? "Келесі →" : "Аяқтау"}
                            </button>
                        </div>
                    ` : ""}
                </div>
            `;
        }

        window.pickQuizAnswer = function (oi) {
            if (!activeQuizRun || activeQuizRun.locked) return;
            const curQ = activeQuizRun.quiz.questions[activeQuizRun.idx];
            activeQuizRun.locked = true;
            activeQuizRun.chosen = oi;
            if (oi === curQ.ans) activeQuizRun.points += 100;
            paintQuizPlayer();
        };

        window.advanceQuizPlayer = async function () {
            if (!activeQuizRun) return;
            if (activeQuizRun.idx + 1 < activeQuizRun.quiz.questions.length) {
                activeQuizRun.idx += 1;
                activeQuizRun.locked = false;
                activeQuizRun.chosen = null;
                paintQuizPlayer();
            } else {
                const earned = activeQuizRun.points;
                const qTitle = activeQuizRun.quiz.title;
                const prof = currentProfile();
                store.submissions.unshift({
                    id: "sub_" + Date.now(),
                    studentName: prof.name,
                    category: "Квиз",
                    title: qTitle,
                    result: `${earned} ұпай`,
                    score: Math.min(10, Math.max(1, Math.round(earned / 20)))
                });
                activeQuizRun = null;
                renderActivePage();
                pushSystemNotification("Нәтиже", `${qTitle}: ${earned} ұпай`, "success");
                await syncStateToCloud();
            }
        };

                                <div class="flex justify-between text-xs font-bold"><span>R</span><span id="lblOhms">${simState.ohms} Ом</span></div>
